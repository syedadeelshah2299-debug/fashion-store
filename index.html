<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Noor & Weave — Premium Pakistani Fashion</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15130F;
    --ivory:#F3EDE3;
    --maroon:#7A2E2E;
    --maroon-light:#9c4040;
    --brass:#B08D57;
    --sand:#DCD2BE;
    --sand-dim:#c9bda3;
    --line: rgba(243,237,227,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--ink);
    color:var(--ivory);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.serif{ font-family:'Playfair Display', serif; }
  .eyebrow{
    text-transform:uppercase;
    letter-spacing:0.22em;
    font-size:11px;
    font-weight:600;
    color:var(--brass);
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  img{display:block; max-width:100%;}
  ::selection{background:var(--maroon); color:var(--ivory);}

  /* reduced motion */
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  :focus-visible{ outline:2px solid var(--brass); outline-offset:3px; }

  /* ---------- Layout shell ---------- */
  .app{min-height:100vh; display:flex; flex-direction:column;}
  .container{ width:100%; max-width:1280px; margin:0 auto; padding:0 28px; }

  /* ---------- Announcement bar ---------- */
  .announce{
    background:var(--maroon); color:var(--ivory); text-align:center;
    padding:10px 20px; font-size:12px; letter-spacing:0.06em; font-weight:500;
    position:relative; z-index:60;
  }
  .announce b{ color:var(--brass); font-weight:600; }

  /* ---------- Nav ---------- */
  .nav{
    position:sticky; top:0; z-index:50;
    background:rgba(21,19,15,0.92);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{ display:flex; align-items:center; justify-content:space-between; padding:20px 28px; max-width:1280px; margin:0 auto; }
  .brand{ display:flex; flex-direction:column; line-height:1; cursor:pointer; }
  .brand-name{ font-size:22px; font-weight:700; letter-spacing:0.01em; }
  .brand-sub{ font-size:9px; letter-spacing:0.28em; color:var(--brass); text-transform:uppercase; margin-top:4px; }
  .nav-links{ display:flex; gap:36px; align-items:center; }
  .nav-links a{ font-size:13px; letter-spacing:0.04em; color:var(--sand-dim); transition:color .25s; position:relative; }
  .nav-links a:hover{ color:var(--ivory); }
  .nav-right{ display:flex; align-items:center; gap:20px; }
  .icon-btn{ position:relative; font-size:19px; color:var(--ivory); padding:4px; }
  .cart-count{
    position:absolute; top:-6px; right:-8px; background:var(--maroon); color:var(--ivory);
    font-size:10px; font-weight:700; width:17px; height:17px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .burger{ display:none; font-size:22px; }

  @media (max-width:860px){
    .nav-links{ display:none; }
    .burger{ display:block; }
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    padding:110px 28px 70px;
    display:grid; grid-template-columns:1.05fr 0.95fr; gap:56px; align-items:center;
    max-width:1280px; margin:0 auto;
    min-height:78vh;
  }
  @media (max-width:900px){
    .hero{ grid-template-columns:1fr; padding-top:56px; min-height:auto; gap:40px; }
  }
  .hero-eyebrow{ display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .hero-eyebrow .rule{ width:34px; height:1px; background:var(--brass); }
  .hero h1{
    font-size:clamp(42px, 6vw, 72px);
    line-height:1.05;
    font-weight:700;
    letter-spacing:-0.015em;
  }
  .hero h1 em{ font-style:italic; color:var(--brass); font-weight:500; }
  .hero p.lead{
    margin-top:24px; font-size:16.5px; line-height:1.75; color:var(--sand-dim); max-width:440px;
  }
  .hero-ctas{ display:flex; gap:14px; margin-top:38px; flex-wrap:wrap; }
  .hero-trust{ display:flex; gap:28px; margin-top:44px; flex-wrap:wrap; }
  .hero-trust .ht-item{ display:flex; align-items:center; gap:9px; }
  .hero-trust .ht-icon{ font-size:16px; color:var(--brass); }
  .hero-trust .ht-text{ font-size:12px; color:var(--sand-dim); letter-spacing:0.02em; }
  .hero-trust .ht-text strong{ color:var(--ivory); display:block; font-size:13px; font-weight:600; }
  .btn{
    padding:16px 32px; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; font-weight:600;
    transition:all .25s cubic-bezier(.2,.8,.2,1); display:inline-flex; align-items:center; gap:8px; border:1px solid transparent;
  }
  .btn-primary{ background:var(--maroon); color:var(--ivory); box-shadow:0 1px 0 rgba(255,255,255,0.08) inset, 0 12px 24px -10px rgba(122,46,46,0.55); }
  .btn-primary:hover{ background:var(--maroon-light); transform:translateY(-2px); box-shadow:0 1px 0 rgba(255,255,255,0.1) inset, 0 18px 30px -10px rgba(122,46,46,0.6); }
  .btn-outline{ border-color:var(--line); color:var(--ivory); }
  .btn-outline:hover{ border-color:var(--brass); color:var(--brass); background:rgba(176,141,87,0.06); }

  .hero-stage{
    perspective:1400px;
    display:flex; align-items:center; justify-content:center;
    height:520px;
  }
  @media (max-width:900px){ .hero-stage{ height:380px; } }
  .drape-wrap{
    position:relative; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    transform-style:preserve-3d;
    animation:floatY 6s ease-in-out infinite;
  }
  .drape-card{
    width:300px; height:420px;
    border-radius:4px;
    background:linear-gradient(155deg, var(--maroon) 0%, #5c2020 55%, #3a1414 100%);
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.7), inset 0 0 60px rgba(176,141,87,0.08);
    transform: rotateY(-18deg) rotateX(6deg);
    position:relative;
    overflow:hidden;
    animation:rotateDrape 14s ease-in-out infinite;
    border:1px solid rgba(176,141,87,0.25);
  }
  .drape-card::before{
    content:'';
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(115deg, rgba(243,237,227,0.05) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(25deg, rgba(0,0,0,0.12) 0 3px, transparent 3px 34px);
  }
  .drape-card::after{
    content:'';
    position:absolute; top:0; left:-40%; width:40%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(243,237,227,0.12), transparent);
    animation:sheen 5s ease-in-out infinite;
  }
  .drape-label{
    position:absolute; bottom:22px; left:22px; right:22px;
  }
  .drape-label .eyebrow{ color:var(--sand); opacity:0.85; }
  .drape-label .title{ font-family:'Playfair Display',serif; font-size:20px; margin-top:6px; }
  .drape-back{
    position:absolute; width:260px; height:380px; border-radius:4px;
    background:linear-gradient(155deg, #2a2620, #1a1712);
    border:1px solid var(--line);
    transform: translateZ(-90px) translateX(60px) rotateY(-18deg) rotateX(6deg);
    opacity:0.7;
  }
  @keyframes floatY{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-14px);} }
  @keyframes rotateDrape{
    0%,100%{ transform:rotateY(-18deg) rotateX(6deg);}
    50%{ transform:rotateY(-6deg) rotateX(3deg);}
  }
  @keyframes sheen{ 0%{ left:-40%;} 60%,100%{ left:120%;} }

  .orbit-dot{
    position:absolute; width:8px; height:8px; border-radius:50%; background:var(--brass);
    box-shadow:0 0 16px 4px rgba(176,141,87,0.5);
  }

  /* ---------- Trust strip ---------- */
  .trust-strip{ border-bottom:1px solid var(--line); }
  .trust-grid{ display:grid; grid-template-columns:repeat(4,1fr); }
  @media (max-width:760px){ .trust-grid{ grid-template-columns:repeat(2,1fr); } }
  .trust-cell{
    display:flex; align-items:center; gap:14px; padding:26px 28px;
    border-right:1px solid var(--line);
  }
  .trust-cell:nth-child(4){ border-right:none; }
  @media (max-width:760px){ .trust-cell:nth-child(2){ border-right:none; } .trust-cell:nth-child(3){ border-right:1px solid var(--line); } }
  .trust-cell .tc-icon{ font-size:20px; color:var(--brass); flex-shrink:0; }
  .trust-cell .tc-title{ font-size:12.5px; font-weight:600; }
  .trust-cell .tc-sub{ font-size:11px; color:var(--sand-dim); margin-top:2px; }

  /* ---------- Marquee strip ---------- */
  .marquee-strip{
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:16px 0; overflow:hidden; white-space:nowrap; background:rgba(243,237,227,0.02);
  }
  .marquee-track{ display:inline-flex; gap:60px; animation:marquee 28s linear infinite; }
  .marquee-track span{ font-family:'Playfair Display',serif; font-style:italic; font-size:15px; color:var(--sand-dim); letter-spacing:0.02em; }
  @keyframes marquee{ from{ transform:translateX(0);} to{ transform:translateX(-50%);} }

  /* ---------- Section headers ---------- */
  .section{ padding:100px 0; }
  .section-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:52px; gap:20px; flex-wrap:wrap; }
  .section-head h2{ font-size:clamp(30px,3.6vw,42px); font-weight:600; margin-top:12px; letter-spacing:-0.01em; }
  .section-head .view-all{ font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--brass); border-bottom:1px solid var(--brass); padding-bottom:4px; transition:opacity .2s; }
  .section-head .view-all:hover{ opacity:0.7; }

  /* ---------- Product grid ---------- */
  .grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:32px 28px; }
  @media (max-width:1000px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .grid{ grid-template-columns:1fr; } }

  .card{
    cursor:pointer;
    perspective:1000px;
  }
  .card-media{
    aspect-ratio:3/4;
    position:relative;
    overflow:hidden;
    background:var(--sand);
    border-radius:3px;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s ease;
    box-shadow:0 1px 2px rgba(0,0,0,0.2);
  }
  .card:hover .card-media{ transform:rotateY(-5deg) rotateX(1.5deg) scale(1.015); box-shadow:0 30px 50px -20px rgba(0,0,0,0.6); }
  .card-media img{ width:100%; height:100%; object-fit:cover; transition:transform .7s cubic-bezier(.2,.8,.2,1); }
  .card:hover .card-media img{ transform:scale(1.07); }
  .card-media .tag{
    position:absolute; top:14px; left:14px; background:rgba(21,19,15,0.85); backdrop-filter:blur(6px); color:var(--brass);
    font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; padding:7px 11px; font-weight:600;
  }
  .card-media .wishlist{
    position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%;
    background:rgba(21,19,15,0.6); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center;
    font-size:14px; opacity:0; transition:opacity .25s ease;
  }
  .card:hover .card-media .wishlist{ opacity:1; }
  .card-quickadd{
    position:absolute; bottom:0; left:0; right:0; background:rgba(21,19,15,0.95); backdrop-filter:blur(8px);
    padding:13px; text-align:center; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;
    transform:translateY(100%); transition:transform .35s cubic-bezier(.2,.8,.2,1); color:var(--ivory); font-weight:600;
    border-top:1px solid rgba(176,141,87,0.25);
  }
  .card:hover .card-quickadd{ transform:translateY(0); }
  .card-info{ padding-top:16px; }
  .card-info .ccat{ font-size:10px; color:var(--brass); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:5px; display:block; }
  .card-info .cname{ font-family:'Playfair Display',serif; font-size:16.5px; line-height:1.3; }
  .card-info .cmeta{ display:flex; justify-content:space-between; align-items:center; margin-top:9px; }
  .card-info .cprice{ color:var(--ivory); font-size:14.5px; font-weight:600; }
  .card-info .cstars{ font-size:11px; }

  .empty-state{
    text-align:center; padding:70px 20px; border:1px dashed var(--line); color:var(--sand-dim);
  }
  .empty-state h3{ color:var(--ivory); margin-bottom:10px; font-size:22px; }

  /* ---------- Filter bar ---------- */
  .filter-bar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:40px; }
  .chip{
    padding:9px 18px; border:1px solid var(--line); font-size:12px; letter-spacing:0.05em; text-transform:uppercase;
    transition:all .2s;
  }
  .chip.active, .chip:hover{ border-color:var(--brass); color:var(--brass); }
  .search-input{
    flex:1; min-width:200px; background:transparent; border:1px solid var(--line); color:var(--ivory);
    padding:9px 16px; font-size:13px;
  }
  .search-input::placeholder{ color:var(--sand-dim); }

  /* ---------- Footer ---------- */
  .footer{ border-top:1px solid var(--line); padding:60px 0 30px; margin-top:60px; }
  .footer-grid{ display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:40px; margin-bottom:50px; }
  @media (max-width:760px){ .footer-grid{ grid-template-columns:1fr 1fr; } }
  .footer h4{ font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--brass); margin-bottom:16px; }
  .footer ul{ list-style:none; display:flex; flex-direction:column; gap:10px; }
  .footer ul a{ font-size:13.5px; color:var(--sand-dim); }
  .footer ul a:hover{ color:var(--ivory); }
  .footer-bottom{ display:flex; justify-content:space-between; padding-top:24px; border-top:1px solid var(--line); font-size:12px; color:var(--sand-dim); flex-wrap:wrap; gap:10px; }

  /* ---------- Product detail ---------- */
  .pd-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:60px; padding:60px 0 100px; }
  @media (max-width:860px){ .pd-wrap{ grid-template-columns:1fr; gap:32px; padding-top:30px; } }
  .pd-media{
    aspect-ratio:4/5; background:var(--sand); overflow:hidden; perspective:1200px; border-radius:2px;
  }
  .pd-media img{ width:100%; height:100%; object-fit:cover; }
  .pd-info .eyebrow{ margin-bottom:10px; }
  .pd-info h1{ font-size:clamp(28px,4vw,42px); margin-bottom:14px; }
  .pd-price{ font-size:22px; color:var(--brass); font-weight:600; margin-bottom:24px; }
  .pd-desc{ color:var(--sand-dim); line-height:1.8; font-size:14.5px; margin-bottom:30px; max-width:480px; }
  .pd-meta-row{ display:flex; gap:30px; margin-bottom:30px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:20px 0; }
  .pd-meta-row div span{ display:block; }
  .pd-meta-row .k{ font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--sand-dim); margin-bottom:6px; }
  .pd-meta-row .v{ font-size:14px; }
  .qty-row{ display:flex; align-items:center; gap:16px; margin-bottom:26px; }
  .qty-box{ display:flex; align-items:center; border:1px solid var(--line); }
  .qty-box button{ padding:10px 16px; font-size:16px; }
  .qty-box span{ padding:0 14px; min-width:30px; text-align:center; }
  .pd-actions{ display:flex; gap:14px; flex-wrap:wrap; }
  .back-link{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px; letter-spacing:0.05em; text-transform:uppercase; color:var(--sand-dim); margin:26px 0 0; }
  .back-link:hover{ color:var(--ivory); }

  /* ---------- Cart drawer ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:90; opacity:0; pointer-events:none; transition:opacity .3s; }
  .overlay.open{ opacity:1; pointer-events:all; }
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:420px; max-width:92vw;
    background:var(--ink); border-left:1px solid var(--line); z-index:95;
    transform:translateX(100%); transition:transform .4s cubic-bezier(.2,.8,.2,1);
    display:flex; flex-direction:column;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{ display:flex; justify-content:space-between; align-items:center; padding:24px 26px; border-bottom:1px solid var(--line); }
  .drawer-head h3{ font-size:19px; }
  .drawer-body{ flex:1; overflow-y:auto; padding:20px 26px; }
  .cart-item{ display:flex; gap:14px; padding:16px 0; border-bottom:1px solid var(--line); }
  .cart-item img{ width:76px; height:96px; object-fit:cover; }
  .cart-item .ci-info{ flex:1; }
  .cart-item .ci-name{ font-family:'Playfair Display',serif; font-size:14.5px; margin-bottom:6px; }
  .cart-item .ci-meta{ font-size:11.5px; color:var(--sand-dim); margin-bottom:10px; }
  .cart-item .ci-row{ display:flex; justify-content:space-between; align-items:center; }
  .ci-remove{ font-size:11px; color:var(--maroon-light); text-transform:uppercase; letter-spacing:0.05em; }
  .drawer-foot{ padding:22px 26px; border-top:1px solid var(--line); }
  .drawer-foot .sub-row{ display:flex; justify-content:space-between; margin-bottom:16px; font-size:15px; }
  .drawer-foot .sub-row strong{ color:var(--brass); }
  .drawer-foot .btn{ width:100%; justify-content:center; margin-bottom:10px; }

  /* ---------- Admin ---------- */
  .admin-shell{ min-height:100vh; background:#0e0c09; }
  .admin-nav{ display:flex; justify-content:space-between; align-items:center; padding:20px 32px; border-bottom:1px solid var(--line); }
  .admin-body{ padding:32px; max-width:1100px; margin:0 auto; }
  .admin-login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ width:100%; max-width:380px; border:1px solid var(--line); padding:40px 32px; }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--sand-dim); margin-bottom:8px; }
  .field input, .field textarea, .field select{
    width:100%; background:rgba(243,237,227,0.04); border:1px solid var(--line); color:var(--ivory);
    padding:12px 14px; font-size:14px; font-family:inherit;
  }
  .field textarea{ resize:vertical; min-height:90px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .admin-error{ color:#e07a7a; font-size:12.5px; margin-top:10px; }
  .admin-table{ width:100%; border-collapse:collapse; margin-top:10px; }
  .admin-table th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--sand-dim); padding:12px 10px; border-bottom:1px solid var(--line); }
  .admin-table td{ padding:14px 10px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
  .admin-table img{ width:44px; height:56px; object-fit:cover; }
  .admin-actions-cell{ display:flex; gap:14px; }
  .link-btn{ font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:var(--brass); }
  .link-btn.danger{ color:#e07a7a; }
  .admin-panel-box{ border:1px solid var(--line); padding:28px; margin-bottom:30px; }
  .admin-panel-box h3{ margin-bottom:20px; font-size:18px; }
  .img-upload-preview{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .img-upload-preview .thumb{ position:relative; width:70px; height:88px; }
  .img-upload-preview img{ width:100%; height:100%; object-fit:cover; }
  .img-upload-preview .rm{ position:absolute; top:-6px; right:-6px; background:var(--maroon); width:18px; height:18px; border-radius:50%; font-size:11px; display:flex; align-items:center; justify-content:center; }
  .upload-box{
    border:1px dashed var(--line); padding:18px; text-align:center; font-size:12.5px; color:var(--sand-dim);
    cursor:pointer; transition:border-color .2s;
  }
  .upload-box:hover{ border-color:var(--brass); }
  .stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:34px; }
  .stat-box{ border:1px solid var(--line); padding:22px; }
  .stat-box .num{ font-family:'Playfair Display',serif; font-size:32px; color:var(--brass); }
  .stat-box .lbl{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--sand-dim); margin-top:6px; }
  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--maroon); color:var(--ivory); padding:14px 26px; font-size:13px; letter-spacing:0.03em;
    z-index:200; transition:all .3s; pointer-events:none;
  }

/* ---------------- Placeholder image generator (styled SVG "photography") ---------------- */
function placeholderImg(seed, w=700, h=900){
  const palettes = [
    { base:'#8a3535', mid:'#5c2222', deep:'#2a1010', light:'#c48a5a' },
    { base:'#b8935f', mid:'#8a6b3e', deep:'#3d2e18', light:'#e8d4b0' },
    { base:'#4a5a45', mid:'#2f3a2b', deep:'#151b13', light:'#a8b89a' },
    { base:'#5a4a6b', mid:'#3a3048', deep:'#191420', light:'#b8a8c8' },
    { base:'#6b4a35', mid:'#452f20', deep:'#1e140d', light:'#c9a878' },
    { base:'#3a4f5f', mid:'#243440', deep:'#0f1a20', light:'#8fb0c0' },
  ];
  let hash = 0;
  for(let i=0;i<seed.length;i++){ hash = seed.charCodeAt(i) + ((hash<<5)-hash); }
  const p = palettes[Math.abs(hash) % palettes.length];
  const seed2 = Math.abs(hash) % 100;
  // fold-line positions to fake garment drape structure
  const folds = Array.from({length:6}).map((_,i)=>{
    const x = (w/6)*i + (seed2 % 20);
    const curve = 30 + (i%3)*18;
    return `M${x},0 C${x+curve},${h*0.35} ${x-curve},${h*0.65} ${x},${h}`;
  });
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}' viewBox='0 0 ${w} ${h}'>
    <defs>
      <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
        <stop offset='0%' stop-color='${p.base}'/>
        <stop offset='55%' stop-color='${p.mid}'/>
        <stop offset='100%' stop-color='${p.deep}'/>
      </linearGradient>
      <radialGradient id='vin' cx='50%' cy='35%' r='75%'>
        <stop offset='0%' stop-color='#000' stop-opacity='0'/>
        <stop offset='100%' stop-color='#000' stop-opacity='0.45'/>
      </radialGradient>
      <linearGradient id='sheen' x1='0' y1='0' x2='1' y2='0.3'>
        <stop offset='0%' stop-color='#fff' stop-opacity='0'/>
        <stop offset='45%' stop-color='#fff' stop-opacity='0.12'/>
        <stop offset='60%' stop-color='#fff' stop-opacity='0'/>
      </linearGradient>
    </defs>
    <rect width='${w}' height='${h}' fill='url(#bg)'/>
    ${folds.map((d,i)=>`<path d='${d}' fill='none' stroke='${i%2===0?p.deep:p.light}' stroke-opacity='${i%2===0?0.35:0.18}' stroke-width='${18+i*3}'/>`).join('')}
    <rect width='${w}' height='${h}' fill='url(#sheen)'/>
    <rect width='${w}' height='${h}' fill='url(#vin)'/>
    <circle cx='${w*0.78}' cy='${h*0.22}' r='${w*0.16}' fill='${p.light}' opacity='0.08'/>
  </svg>`;
  return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
}

/* ---------------- Supabase setup ---------------- */
const SUPABASE_URL = 'https://qkysezjkclpclkmrnops.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DK4vPx2YLcWKRqts_McmFQ_A2JHTyQ-';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* Map a Supabase row (image_url: string) to the app's product shape (images: array) */
function rowToProduct(row){
  return {
    id: String(row.id),
    name: row.name || '',
    category: row.category || CATEGORIES[0],
    price: Number(row.price) || 0,
    desc: row.description || '',
    fabric: row.fabric || '',
    images: row.image_url ? [row.image_url] : [placeholderImg(row.name || 'product')],
    featured: !!row.featured,
    rating: row.rating || 4,
  };
}

/* Map the app's product shape back to a Supabase row for insert/update */
function productToRow(p){
  return {
    name: p.name,
    category: p.category,
    price: p.price,
    description: p.desc,
    image_url: p.images && p.images[0] ? p.images[0] : null,
    featured: !!p.featured,
  };
}

/* ---------------- Storage helpers (Supabase-backed) ---------------- */
async function loadProducts(){
  try{
    const { data, error } = await supabase.from('products').select('*').order('id', { ascending:false });
    if(error){ console.error('Supabase load error:', error); return []; }
    if(data && data.length){ return data.map(rowToProduct); }
    return [];
  }catch(e){
    console.error('Supabase load exception:', e);
    return [];
  }
}

async function insertProduct(p){
  const { data, error } = await supabase.from('products').insert([productToRow(p)]).select();
  if(error){ console.error('Supabase insert error:', error); throw error; }
  return data && data[0] ? rowToProduct(data[0]) : null;
}

async function updateProductRow(id, p){
  const { data, error } = await supabase.from('products').update(productToRow(p)).eq('id', id).select();
  if(error){ console.error('Supabase update error:', error); throw error; }
  return data && data[0] ? rowToProduct(data[0]) : null;
}

async function deleteProductRow(id){
  const { error } = await supabase.from('products').delete().eq('id', id);
  if(error){ console.error('Supabase delete error:', error); throw error; }
}

/* Cart stays local to the browser (no login system), so localStorage-free in-memory + simple persistence via window.storage if available, else memory only */
async function loadCart(){
  try{
    const res = await window.storage.get('cart', false);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){}
  return [];
}
async function saveCart(cart){
  try{ await window.storage.set('cart', JSON.stringify(cart), false); }catch(e){}
}

/* ---------------- Toast ---------------- */
function useToast(){
  const [msg, setMsg] = useState('');
  const [show, setShow] = useState(false);
  const fire = useCallback((m)=>{
    setMsg(m); setShow(true);
    setTimeout(()=>setShow(false), 2200);
  },[]);
  const node = <div className={`toast ${show?'show':''}`}>{msg}</div>;
  return [fire, node];
}

/* ---------------- Cart Drawer ---------------- */
function CartDrawer({ open, close, cart, updateQty, removeItem, products }){
  const items = cart.map(ci=>({ ...ci, product: products.find(p=>p.id===ci.id) })).filter(x=>x.product);
  const total = items.reduce((s,x)=>s + x.product.price * x.qty, 0);

  const checkoutWhatsapp = () => {
    if(items.length===0) return;
    let lines = items.map(x=>`• ${x.product.name} × ${x.qty} — Rs. ${(x.product.price*x.qty).toLocaleString()}`).join('\n');
    const msg = encodeURIComponent(`Hi, I'd like to place an order:\n\n${lines}\n\nTotal: Rs. ${total.toLocaleString()}\n\nName:\nAddress:\nCity:`);
    window.open(`https://wa.me/923000000000?text=${msg}`, '_blank');
  };

  return (
    <React.Fragment>
      <div className={`overlay ${open?'open':''}`} onClick={close}></div>
      <div className={`drawer ${open?'open':''}`}>
        <div className="drawer-head">
          <h3 className="serif">Your Bag ({items.length})</h3>
          <button onClick={close} style={{fontSize:20}} aria-label="Close cart">✕</button>
        </div>
        <div className="drawer-body">
          {items.length===0 ? (
            <div className="empty-state"><h3>Your bag is empty</h3><p>Add something beautiful.</p></div>
          ) : items.map(x=>(
            <div className="cart-item" key={x.id}>
              <img src={x.product.images[0]} alt={x.product.name} />
              <div className="ci-info">
                <div className="ci-name serif">{x.product.name}</div>
                <div className="ci-meta">{x.product.category}</div>
                <div className="ci-row">
                  <div className="qty-box">
                    <button onClick={()=>updateQty(x.id, Math.max(1, x.qty-1))}>−</button>
                    <span>{x.qty}</span>
                    <button onClick={()=>updateQty(x.id, x.qty+1)}>+</button>
                  </div>
                  <button className="ci-remove" onClick={()=>removeItem(x.id)}>Remove</button>
                </div>
              </div>
            </div>
          ))}
        </div>
        {items.length>0 && (
          <div className="drawer-foot">
            <div className="sub-row"><span>Subtotal</span><strong>Rs. {total.toLocaleString()}</strong></div>
            <button className="btn btn-primary" onClick={checkoutWhatsapp}>Checkout via WhatsApp</button>
            <button className="btn btn-outline" onClick={close}>Continue Shopping</button>
          </div>
        )}
      </div>
    </React.Fragment>
  );
}

/* ---------------- Admin: Login ---------------- */
function AdminLogin({ onSuccess }){
  const [pass, setPass] = useState('');
  const [err, setErr] = useState('');
  const submit = (e) => {
    e.preventDefault();
    if(pass === 'admin123'){ onSuccess(); }
    else setErr('Incorrect password. Try again.');
  };
  return (
    <div className="admin-login">
      <div className="login-card">
        <span className="eyebrow">Store Admin</span>
        <h2 className="serif" style={{marginTop:10, marginBottom:26}}>Sign in</h2>
        <form onSubmit={submit}>
          <div className="field">
            <label>Password</label>
            <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="Enter admin password" autoFocus />
          </div>
          <button className="btn btn-primary" type="submit" style={{width:'100%', justifyContent:'center'}}>Sign In</button>
          {err && <div className="admin-error">{err}</div>}
        </form>
        <p style={{fontSize:11.5, color:'var(--sand-dim)', marginTop:18}}>Default password: <strong style={{color:'var(--brass)'}}>admin123</strong> — change this in the code before handing off to a client.</p>
      </div>
    </div>
  );
}

/* ---------------- Admin: Product Form ---------------- */
function emptyProduct(){
  return { id:'', name:'', category:CATEGORIES[0], price:'', desc:'', fabric:'', images:[], featured:false, rating:5 };
}

function ProductForm({ initial, onSave, onCancel }){
  const [form, setForm] = useState(initial || emptyProduct());
  const fileRef = useRef(null);

  const handleFiles = (files) => {
    Array.from(files).forEach(file=>{
      const reader = new FileReader();
      reader.onload = (e) => {
        setForm(f=>({ ...f, images:[...f.images, e.target.result] }));
      };
      reader.readAsDataURL(file);
    });
  };

  const removeImage = (idx) => {
    setForm(f=>({ ...f, images:f.images.filter((_,i)=>i!==idx) }));
  };

  const submit = (e) => {
    e.preventDefault();
    if(!form.name.trim() || !form.price){ return; }
    const finalImages = form.images.length ? form.images : [placeholderImg(form.name||'product')];
    onSave({
      ...form,
      id: form.id || ('p_' + Date.now()),
      price: Number(form.price),
      images: finalImages,
    });
  };

  return (
    <div className="admin-panel-box">
      <h3 className="serif">{initial ? 'Edit Product' : 'Add New Product'}</h3>
      <form onSubmit={submit}>
        <div className="field-row">
          <div className="field">
            <label>Product Name</label>
            <input value={form.name} onChange={e=>setForm(f=>({...f, name:e.target.value}))} placeholder="e.g. Zareen Embroidered Lawn" required />
          </div>
          <div className="field">
            <label>Price (PKR)</label>
            <input type="number" min="0" value={form.price} onChange={e=>setForm(f=>({...f, price:e.target.value}))} placeholder="e.g. 4500" required />
          </div>
        </div>
        <div className="field-row">
          <div className="field">
            <label>Category</label>
            <select value={form.category} onChange={e=>setForm(f=>({...f, category:e.target.value}))}>
              {CATEGORIES.map(c=>(<option key={c} value={c}>{c}</option>))}
            </select>
          </div>
          <div className="field">
            <label>Fabric</label>
            <input value={form.fabric} onChange={e=>setForm(f=>({...f, fabric:e.target.value}))} placeholder="e.g. Pure Lawn" />
          </div>
        </div>
        <div className="field">
          <label>Description</label>
          <textarea value={form.desc} onChange={e=>setForm(f=>({...f, desc:e.target.value}))} placeholder="Describe the fabric, fit, and details customers should know..." />
        </div>
        <div className="field">
          <label>Product Images</label>
          <div className="upload-box" onClick={()=>fileRef.current.click()}>
            Click to upload images (or drag files here)
          </div>
          <input ref={fileRef} type="file" accept="image/*" multiple style={{display:'none'}} onChange={e=>handleFiles(e.target.files)} />
          {form.images.length>0 && (
            <div className="img-upload-preview">
              {form.images.map((img,i)=>(
                <div className="thumb" key={i}>
                  <img src={img} />
                  <button type="button" className="rm" onClick={()=>removeImage(i)}>✕</button>
                </div>
              ))}
            </div>
          )}
          <p style={{fontSize:11, color:'var(--sand-dim)', marginTop:8}}>No image? A placeholder will be used automatically.</p>
        </div>
        <div className="field" style={{display:'flex', alignItems:'center', gap:10}}>
          <input type="checkbox" id="featured" style={{width:'auto'}} checked={form.featured} onChange={e=>setForm(f=>({...f, featured:e.target.checked}))} />
          <label htmlFor="featured" style={{margin:0}}>Mark as Featured (shows on homepage)</label>
        </div>
        <div style={{display:'flex', gap:12, marginTop:10}}>
          <button className="btn btn-primary" type="submit">{initial ? 'Save Changes' : 'Add Product'}</button>
          <button className="btn btn-outline" type="button" onClick={onCancel}>Cancel</button>
        </div>
      </form>
    </div>
  );
}

/* ---------------- Admin: Dashboard ---------------- */
function AdminDashboard({ products, setProducts, fireToast, onLogout }){
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);

  const [saving, setSaving] = useState(false);

  const handleSave = async (product) => {
    setSaving(true);
    try{
      if(editing){
        const saved = await updateProductRow(editing.id, product);
        if(saved){
          setProducts(products.map(p=>p.id===editing.id ? saved : p));
          fireToast('Product updated');
        }
      } else {
        const saved = await insertProduct(product);
        if(saved){
          setProducts([saved, ...products]);
          fireToast('Product added');
        }
      }
      setShowForm(false);
      setEditing(null);
    }catch(e){
      fireToast('Error saving product — check console');
    }
    setSaving(false);
  };

  const handleDelete = async (id) => {
    if(!window.confirm('Delete this product? This cannot be undone.')) return;
    try{
      await deleteProductRow(id);
      setProducts(products.filter(p=>p.id!==id));
      fireToast('Product deleted');
    }catch(e){
      fireToast('Error deleting product — check console');
    }
  };

  const totalValue = products.reduce((s,p)=>s+p.price,0);

  return (
    <div className="admin-shell">
      <div className="admin-nav">
        <div className="brand"><span className="brand-name serif">Noor &amp; Weave</span><span className="brand-sub">Admin Dashboard</span></div>
        <div style={{display:'flex', gap:20, alignItems:'center'}}>
          <a href="#" onClick={(e)=>{e.preventDefault(); window.location.hash='';}} style={{fontSize:13, color:'var(--sand-dim)'}}>View Store →</a>
          <button className="btn btn-outline" onClick={onLogout}>Log Out</button>
        </div>
      </div>
      <div className="admin-body">
        <div className="stat-row">
          <div className="stat-box"><div className="num serif">{products.length}</div><div className="lbl">Total Products</div></div>
          <div className="stat-box"><div className="num serif">{products.filter(p=>p.featured).length}</div><div className="lbl">Featured Items</div></div>
          <div className="stat-box"><div className="num serif">Rs. {totalValue.toLocaleString()}</div><div className="lbl">Catalog Value</div></div>
        </div>

        {showForm ? (
          <ProductForm
            initial={editing}
            onSave={handleSave}
            onCancel={()=>{ setShowForm(false); setEditing(null); }}
          />
        ) : (
          <button className="btn btn-primary" onClick={()=>setShowForm(true)} style={{marginBottom:30}}>+ Add New Product</button>
        )}

        <div className="admin-panel-box">
          <h3 className="serif">All Products</h3>
          {products.length===0 ? (
            <div className="empty-state"><h3>No products yet</h3><p>Click "Add New Product" to get started.</p></div>
          ) : (
            <table className="admin-table">
              <thead>
                <tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Featured</th><th>Actions</th></tr>
              </thead>
              <tbody>
                {products.map(p=>(
                  <tr key={p.id}>
                    <td><img src={p.images[0]} alt={p.name} /></td>
                    <td>{p.name}</td>
                    <td>{p.category}</td>
                    <td>Rs. {p.price.toLocaleString()}</td>
                    <td>{p.featured ? 'Yes' : '—'}</td>
                    <td>
                      <div className="admin-actions-cell">
                        <button className="link-btn" onClick={()=>{ setEditing(p); setShowForm(true); window.scrollTo({top:0, behavior:'smooth'}); }}>Edit</button>
                        <button className="link-btn danger" onClick={()=>handleDelete(p.id)}>Delete</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

function Admin({ products, setProducts, fireToast }){
  const [authed, setAuthed] = useState(false);
  if(!authed) return <AdminLogin onSuccess={()=>setAuthed(true)} />;
  return <AdminDashboard products={products} setProducts={setProducts} fireToast={fireToast} onLogout={()=>setAuthed(false)} />;
}

/* ---------------- App Shell ---------------- */
function App(){
  const [route, setRoute] = useState('home');
  const [params, setParams] = useState({});
  const [products, setProducts] = useState([]);
  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const [loading, setLoading] = useState(true);
  const [fireToast, toastNode] = useToast();

  useEffect(()=>{
    (async ()=>{
      const [p, c] = await Promise.all([loadProducts(), loadCart()]);
      setProducts(p);
      setCart(c);
      setLoading(false);
    })();
  }, []);

  const go = (r, p={}) => {
    setRoute(r); setParams(p);
    window.scrollTo({top:0, behavior:'instant'});
  };

  const addToCart = async (product, qty=1) => {
    setCart(prev=>{
      const existing = prev.find(x=>x.id===product.id);
      let updated;
      if(existing){
        updated = prev.map(x=>x.id===product.id ? {...x, qty:x.qty+qty} : x);
      } else {
        updated = [...prev, { id:product.id, qty }];
      }
      saveCart(updated);
      return updated;
    });
    fireToast(`Added "${product.name}" to bag`);
    setCartOpen(true);
  };

  const quickAdd = (product) => addToCart(product, 1);

  const updateQty = async (id, qty) => {
    setCart(prev=>{
      const updated = prev.map(x=>x.id===id ? {...x, qty} : x);
      saveCart(updated);
      return updated;
    });
  };

  const removeItem = async (id) => {
    setCart(prev=>{
      const updated = prev.filter(x=>x.id!==id);
      saveCart(updated);
      return updated;
    });
    fireToast('Removed from bag');
  };

  const cartCount = cart.reduce((s,x)=>s+x.qty, 0);

  if(loading){
    return (
      <div className="loading-screen">
        <div className="spinner"></div>
        <span className="eyebrow">Loading Noor &amp; Weave</span>
      </div>
    );
  }

  if(route==='admin'){
    return (
      <div className="app">
        <Admin products={products} setProducts={setProducts} fireToast={fireToast} />
        {toastNode}
      </div>
    );
  }

  return (
    <div className="app">
      <div className="announce">Free delivery across Pakistan on orders over <b>Rs. 5,000</b> — Cash on Delivery available</div>
      <Nav route={route} go={go} cartCount={cartCount} openCart={()=>setCartOpen(true)} />
      {route==='home' && <Home products={products} go={go} onQuickAdd={quickAdd} />}
      {route==='shop' && <Shop products={products} params={params} go={go} onQuickAdd={quickAdd} />}
      {route==='product' && <ProductDetail products={products} params={params} go={go} onAddToCart={addToCart} />}
      <Footer go={go} />
      <CartDrawer
        open={cartOpen}
        close={()=>setCartOpen(false)}
        cart={cart}
        updateQty={updateQty}
        removeItem={removeItem}
        products={products}
      />
      {toastNode}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
