<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Noor & Weave — Premium Pakistani Fashion</title>
<meta name="description" content="Hand-finished unstitched suits, stitched kurtas, and formal wear made in Pakistan. Free delivery over Rs. 5,000, Cash on Delivery available nationwide." />
<meta property="og:title" content="Noor & Weave — Premium Pakistani Fashion" />
<meta property="og:description" content="Hand-finished suits and kurtas built for Pakistani mornings. Shop lawns, formals, and everyday wear with Cash on Delivery." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#15130F" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2315130F'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23B08D57' font-family='Georgia,serif'%3EN%3C/text%3E%3C/svg%3E" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#FBF9F6;
    --ivory:#2C2825;
    --maroon:#A85A6B;
    --maroon-light:#8F4657;
    --brass:#9C7A5E;
    --sand:#F3EEE6;
    --sand-dim:#7A7268;
    --line: rgba(44,40,37,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--ink);
    color:var(--ivory);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.serif{ font-family:'Playfair Display', serif; }
  .eyebrow{
    text-transform:uppercase;
    letter-spacing:0.22em;
    font-size:11px;
    font-weight:600;
    color:var(--brass);
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  img{display:block; max-width:100%;}
  ::selection{background:var(--maroon); color:#FBF9F6;}

  /* reduced motion */
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  :focus-visible{ outline:2px solid var(--brass); outline-offset:3px; }

  /* ---------- Layout shell ---------- */
  .app{min-height:100vh; display:flex; flex-direction:column;}
  .container{ width:100%; max-width:1280px; margin:0 auto; padding:0 28px; }

  /* ---------- Announcement bar ---------- */
  .announce{
    background:var(--maroon); color:#FBF9F6; text-align:center;
    padding:10px 20px; font-size:12px; letter-spacing:0.06em; font-weight:500;
    position:relative; z-index:60;
  }
  .announce b{ color:var(--brass); font-weight:600; }

  /* ---------- Nav ---------- */
  .nav{
    position:sticky; top:0; z-index:50;
    background:rgba(251,249,246,0.92);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{ display:flex; align-items:center; justify-content:space-between; padding:20px 28px; max-width:1280px; margin:0 auto; }
  .brand{ display:flex; flex-direction:column; line-height:1; cursor:pointer; }
  .brand-name{ font-size:22px; font-weight:700; letter-spacing:0.01em; }
  .brand-sub{ font-size:9px; letter-spacing:0.28em; color:var(--brass); text-transform:uppercase; margin-top:4px; }
  .nav-links{ display:flex; gap:36px; align-items:center; }
  .nav-item{ position:relative; }
  .nav-item > a, .nav-item > button{ font-size:13px; letter-spacing:0.04em; color:var(--sand-dim); transition:color .25s; position:relative; display:inline-flex; align-items:center; gap:4px; }
  .nav-item:hover > a, .nav-item:hover > button{ color:var(--ivory); }
  .nav-links a{ font-size:13px; letter-spacing:0.04em; color:var(--sand-dim); transition:color .25s; position:relative; }
  .nav-links a:hover{ color:var(--ivory); }
  .mega-caret{ font-size:9px; transition:transform .2s; }
  .nav-item:hover .mega-caret{ transform:rotate(180deg); }
  .mega-panel{
    position:absolute; top:calc(100% + 18px); left:50%; transform:translateX(-50%);
    background:var(--ink); border:1px solid var(--line); box-shadow:0 24px 48px -16px rgba(0,0,0,0.18);
    padding:20px 24px; min-width:200px; display:none; flex-direction:column; gap:2px; z-index:60;
  }
  .nav-item:hover .mega-panel{ display:flex; }
  .mega-panel a{ padding:8px 4px; font-size:13px; color:var(--sand-dim); white-space:nowrap; border-radius:2px; transition:all .15s; }
  .mega-panel a:hover{ color:var(--maroon); padding-left:8px; }
  .mega-panel .mega-all{ font-weight:600; color:var(--ivory); border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:6px; }
  .nav-right{ display:flex; align-items:center; gap:20px; }
  .icon-btn{ position:relative; color:var(--ivory); padding:4px; display:flex; align-items:center; justify-content:center; }
  .cart-count{
    position:absolute; top:-6px; right:-8px; background:var(--maroon); color:#FBF9F6;
    font-size:10px; font-weight:700; width:17px; height:17px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .burger{ display:none; font-size:22px; }

  @media (max-width:860px){
    .nav-links{ display:none; }
    .burger{ display:block; }
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    padding:110px 28px 70px;
    display:grid; grid-template-columns:1.05fr 0.95fr; gap:56px; align-items:center;
    max-width:1280px; margin:0 auto;
    min-height:78vh;
  }
  @media (max-width:900px){
    .hero{ grid-template-columns:1fr; padding-top:56px; min-height:auto; gap:40px; }
  }
  .hero-eyebrow{ display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .hero-eyebrow .rule{ width:34px; height:1px; background:var(--brass); }
  .hero h1{
    font-size:clamp(42px, 6vw, 72px);
    line-height:1.05;
    font-weight:700;
    letter-spacing:-0.015em;
  }
  .hero h1 em{ font-style:italic; color:var(--brass); font-weight:500; }
  .hero p.lead{
    margin-top:24px; font-size:16.5px; line-height:1.75; color:var(--sand-dim); max-width:440px;
  }
  .hero-ctas{ display:flex; gap:14px; margin-top:38px; flex-wrap:wrap; }
  .hero-trust{ display:flex; gap:28px; margin-top:44px; flex-wrap:wrap; }
  .hero-trust .ht-item{ display:flex; align-items:center; gap:9px; }
  .hero-trust .ht-icon{ font-size:16px; color:var(--brass); }
  .hero-trust .ht-text{ font-size:12px; color:var(--sand-dim); letter-spacing:0.02em; }
  .hero-trust .ht-text strong{ color:var(--ivory); display:block; font-size:13px; font-weight:600; }
  .btn{
    padding:16px 32px; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; font-weight:600;
    transition:all .25s cubic-bezier(.2,.8,.2,1); display:inline-flex; align-items:center; gap:8px; border:1px solid transparent;
  }
  .btn-primary{ background:var(--maroon); color:#FBF9F6; box-shadow:0 1px 0 rgba(255,255,255,0.15) inset, 0 12px 24px -10px rgba(184,126,138,0.5); }
  .btn-primary:hover{ background:var(--maroon-light); transform:translateY(-2px); box-shadow:0 1px 0 rgba(255,255,255,0.15) inset, 0 18px 30px -10px rgba(184,126,138,0.55); }
  .btn-outline{ border-color:var(--line); color:var(--ivory); }
  .btn-outline:hover{ border-color:var(--brass); color:var(--brass); background:rgba(176,141,87,0.06); }

  .hero-stage{
    perspective:1400px;
    display:flex; align-items:center; justify-content:center;
    height:520px;
  }
  @media (max-width:900px){ .hero-stage{ height:380px; } }
  .drape-wrap{
    position:relative; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    transform-style:preserve-3d;
    animation:floatY 6s ease-in-out infinite;
  }
  .drape-card{
    width:300px; height:420px;
    border-radius:4px;
    background:linear-gradient(155deg, var(--maroon) 0%, #5c2020 55%, #3a1414 100%);
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.7), inset 0 0 60px rgba(176,141,87,0.08);
    transform: rotateY(-18deg) rotateX(6deg);
    position:relative;
    overflow:hidden;
    animation:rotateDrape 14s ease-in-out infinite;
    border:1px solid rgba(176,141,87,0.25);
  }
  .drape-card--photo img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  .drape-card--photo::before{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(21,19,15,0) 30%, rgba(21,19,15,0.55) 65%, rgba(21,19,15,0.92) 100%);
    z-index:1;
  }
  .drape-card--photo .drape-label{ z-index:2; }
  .drape-card::before{
    content:'';
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(115deg, rgba(243,237,227,0.05) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(25deg, rgba(0,0,0,0.12) 0 3px, transparent 3px 34px);
  }
  .drape-card::after{
    content:'';
    position:absolute; top:0; left:-40%; width:40%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(243,237,227,0.12), transparent);
    animation:sheen 5s ease-in-out infinite;
  }
  .drape-label{
    position:absolute; bottom:22px; left:22px; right:22px;
    color:#FFFFFF;
    text-shadow:0 2px 8px rgba(0,0,0,0.5);
  }
  .drape-label .eyebrow{ color:#F0C4CC; opacity:1; text-shadow:0 1px 4px rgba(0,0,0,0.5); }
  .drape-label .title{ font-family:'Playfair Display',serif; font-size:20px; margin-top:6px; color:#FFFFFF; font-weight:600; }
  .drape-back{
    position:absolute; width:260px; height:380px; border-radius:4px;
    background:linear-gradient(155deg, #2a2620, #1a1712);
    border:1px solid var(--line);
    transform: translateZ(-90px) translateX(60px) rotateY(-18deg) rotateX(6deg);
    opacity:0.7;
  }
  @keyframes floatY{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-14px);} }
  @keyframes rotateDrape{
    0%,100%{ transform:rotateY(-18deg) rotateX(6deg);}
    50%{ transform:rotateY(-6deg) rotateX(3deg);}
  }
  @keyframes sheen{ 0%{ left:-40%;} 60%,100%{ left:120%;} }

  .orbit-dot{
    position:absolute; width:8px; height:8px; border-radius:50%; background:var(--brass);
    box-shadow:0 0 16px 4px rgba(176,141,87,0.5);
  }

  /* ---------- Trust strip ---------- */
  .trust-strip{ border-bottom:1px solid var(--line); }
  .trust-grid{ display:grid; grid-template-columns:repeat(4,1fr); }
  @media (max-width:760px){ .trust-grid{ grid-template-columns:repeat(2,1fr); } }
  .trust-cell{
    display:flex; align-items:center; gap:14px; padding:26px 28px;
    border-right:1px solid var(--line);
  }
  .trust-cell:nth-child(4){ border-right:none; }
  @media (max-width:760px){ .trust-cell:nth-child(2){ border-right:none; } .trust-cell:nth-child(3){ border-right:1px solid var(--line); } }
  .trust-cell .tc-icon{ color:var(--brass); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .trust-cell .tc-title{ font-size:12.5px; font-weight:600; }
  .trust-cell .tc-sub{ font-size:11px; color:var(--sand-dim); margin-top:2px; }

  /* ---------- Marquee strip ---------- */
  .marquee-strip{
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:16px 0; overflow:hidden; white-space:nowrap; background:rgba(42,39,36,0.02);
  }
  .marquee-track{ display:inline-flex; gap:60px; animation:marquee 28s linear infinite; }
  .marquee-track span{ font-family:'Playfair Display',serif; font-style:italic; font-size:15px; color:var(--sand-dim); letter-spacing:0.02em; }
  @keyframes marquee{ from{ transform:translateX(0);} to{ transform:translateX(-50%);} }

  /* ---------- Section headers ---------- */
  .section{ padding:100px 0; }
  .section-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:52px; gap:20px; flex-wrap:wrap; }
  .section-head h2{ font-size:clamp(30px,3.6vw,42px); font-weight:600; margin-top:12px; letter-spacing:-0.01em; }
  .section-head .view-all{ font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--brass); border-bottom:1px solid var(--brass); padding-bottom:4px; transition:opacity .2s; }
  .section-head .view-all:hover{ opacity:0.7; }

  /* ---------- Product grid ---------- */
  .grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:32px 28px; }
  @media (max-width:1000px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .grid{ grid-template-columns:repeat(2,1fr); gap:16px 12px; } }

  .card{
    cursor:pointer;
    perspective:1000px;
  }
  .card-media{
    aspect-ratio:3/4;
    position:relative;
    overflow:hidden;
    background:var(--sand);
    border-radius:3px;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s ease;
    box-shadow:0 1px 2px rgba(0,0,0,0.2);
  }
  .card:hover .card-media{ transform:rotateY(-5deg) rotateX(1.5deg) scale(1.015); box-shadow:0 30px 50px -20px rgba(0,0,0,0.6); }
  .card-media img{ width:100%; height:100%; object-fit:cover; object-position:top; transition:transform .7s cubic-bezier(.2,.8,.2,1); }
  .card:hover .card-media img{ transform:scale(1.07); }
  .card-media .tag{
    position:absolute; top:14px; left:14px; background:rgba(21,19,15,0.85); backdrop-filter:blur(6px); color:var(--brass);
    font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; padding:7px 11px; font-weight:600;
  }
  .card-media .wishlist{
    position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%;
    background:rgba(21,19,15,0.6); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center;
    font-size:14px; opacity:0; transition:opacity .25s ease; color:#F3EDE3;
  }
  .card:hover .card-media .wishlist{ opacity:1; }
  .card-quickadd{
    position:absolute; bottom:0; left:0; right:0; background:rgba(21,19,15,0.95); backdrop-filter:blur(8px);
    padding:13px; text-align:center; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;
    transform:translateY(100%); transition:transform .35s cubic-bezier(.2,.8,.2,1); color:#F3EDE3; font-weight:600;
    border-top:1px solid rgba(176,141,87,0.25);
  }
  .card:hover .card-quickadd{ transform:translateY(0); }
  .card-info{ padding-top:16px; }
  .card-info .ccat{ font-size:10px; color:var(--brass); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:5px; display:block; }
  .card-info .cname{ font-family:'Playfair Display',serif; font-size:16.5px; line-height:1.3; }
  .card-info .cmeta{ display:flex; justify-content:space-between; align-items:center; margin-top:9px; }
  .card-info .cprice{ color:var(--ivory); font-size:14.5px; font-weight:600; }
  .price-row{ display:flex; align-items:baseline; gap:8px; }
  .price-original{ color:var(--sand-dim); font-size:12px; text-decoration:line-through; }
  .sale-badge{
    position:absolute; top:14px; right:14px; background:var(--maroon); color:#FBF9F6;
    font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; padding:6px 10px; font-weight:700;
  }
  .pd-price-row{ display:flex; align-items:baseline; gap:14px; margin-bottom:24px; }
  .pd-price-original{ color:var(--sand-dim); font-size:16px; text-decoration:line-through; }
  .card-info .cstars{ font-size:11px; }

  @media (max-width:560px){
    .card-media .tag{ top:8px; left:8px; font-size:8px; padding:5px 8px; letter-spacing:0.08em; }
    .sale-badge{ top:8px; right:8px; font-size:8px; padding:5px 8px; letter-spacing:0.05em; }
    .card-media .wishlist{ display:none; } /* hidden on mobile to avoid clutter with sale badge; tap card to view/add */
    .card-quickadd{ display:none; } /* hover-only affordance doesn't apply on touch; tapping card already opens product */
    .card-info{ padding-top:10px; }
    .card-info .ccat{ font-size:8.5px; margin-bottom:3px; }
    .card-info .cname{ font-size:13px; line-height:1.25; }
    .card-info .cmeta{ flex-direction:column; align-items:flex-start; gap:4px; margin-top:6px; }
    .card-info .cprice{ font-size:13px; }
    .price-original{ font-size:10.5px; }
    .card-info .cstars{ font-size:9px; }
  }

  .empty-state{
    text-align:center; padding:70px 20px; border:1px dashed var(--line); color:var(--sand-dim);
  }
  .empty-state h3{ color:var(--ivory); margin-bottom:10px; font-size:22px; }

  /* ---------- Filter bar ---------- */
  .filter-bar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:40px; }
  .chip{
    padding:9px 18px; border:1px solid var(--line); font-size:12px; letter-spacing:0.05em; text-transform:uppercase;
    transition:all .2s;
  }
  .chip.active, .chip:hover{ border-color:var(--brass); color:var(--brass); }
  .search-input{
    flex:1; min-width:200px; background:transparent; border:1px solid var(--line); color:var(--ivory);
    padding:9px 16px; font-size:13px;
  }
  .search-input::placeholder{ color:var(--sand-dim); }

  /* ---------- Footer ---------- */
  .footer{ border-top:1px solid var(--line); padding:60px 0 30px; margin-top:60px; }
  .footer-grid{ display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:40px; margin-bottom:50px; }
  @media (max-width:760px){ .footer-grid{ grid-template-columns:1fr 1fr; } }
  .footer h4{ font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--brass); margin-bottom:16px; }
  .footer ul{ list-style:none; display:flex; flex-direction:column; gap:10px; }
  .footer ul a{ font-size:13.5px; color:var(--sand-dim); }
  .footer ul a:hover{ color:var(--ivory); }
  .footer-bottom{ display:flex; justify-content:space-between; padding-top:24px; border-top:1px solid var(--line); font-size:12px; color:var(--sand-dim); flex-wrap:wrap; gap:10px; }

  /* ---------- Product detail ---------- */
  .pd-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:60px; padding:60px 0 100px; }
  @media (max-width:860px){ .pd-wrap{ grid-template-columns:1fr; gap:32px; padding-top:30px; } }
  .pd-media{
    aspect-ratio:4/5; background:var(--sand); overflow:hidden; perspective:1200px; border-radius:2px;
  }
  .pd-media img{ width:100%; height:100%; object-fit:cover; object-position:top; }
  .pd-info .eyebrow{ margin-bottom:10px; }
  .pd-info h1{ font-size:clamp(28px,4vw,42px); margin-bottom:14px; }
  .pd-price{ font-size:22px; color:var(--brass); font-weight:600; margin-bottom:24px; }
  .pd-desc{ color:var(--sand-dim); line-height:1.8; font-size:14.5px; margin-bottom:30px; max-width:480px; }
  .pd-meta-row{ display:flex; gap:30px; margin-bottom:30px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:20px 0; }
  .pd-meta-row div span{ display:block; }
  .pd-meta-row .k{ font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--sand-dim); margin-bottom:6px; }
  .pd-meta-row .v{ font-size:14px; }
  .qty-row{ display:flex; align-items:center; gap:16px; margin-bottom:26px; }
  .qty-box{ display:flex; align-items:center; border:1px solid var(--line); }
  .qty-box button{ padding:10px 16px; font-size:16px; }
  .qty-box span{ padding:0 14px; min-width:30px; text-align:center; }
  .pd-actions{ display:flex; gap:14px; flex-wrap:wrap; }
  .back-link{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px; letter-spacing:0.05em; text-transform:uppercase; color:var(--sand-dim); margin:26px 0 0; }
  .back-link:hover{ color:var(--ivory); }

  /* ---------- Size chart ---------- */
  .size-chart-toggle{
    display:flex; align-items:center; gap:8px; font-size:12.5px; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--brass); border-bottom:1px solid var(--brass); padding-bottom:3px; margin-bottom:20px; width:fit-content;
  }
  .size-chart-table{ width:100
