<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Noor & Weave — Premium Pakistani Fashion</title>
<meta name="description" content="Hand-finished unstitched suits, stitched kurtas, and formal wear made in Pakistan. Free delivery over Rs. 5,000, Cash on Delivery available nationwide." />
<meta property="og:title" content="Noor & Weave — Premium Pakistani Fashion" />
<meta property="og:description" content="Hand-finished suits and kurtas built for Pakistani mornings. Shop lawns, formals, and everyday wear with Cash on Delivery." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#15130F" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2315130F'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23B08D57' font-family='Georgia,serif'%3EN%3C/text%3E%3C/svg%3E" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#FBF9F6;
    --ivory:#2C2825;
    --maroon:#B87E8A;
    --maroon-light:#A56674;
    --brass:#9C7A5E;
    --sand:#F3EEE6;
    --sand-dim:#7A7268;
    --line: rgba(44,40,37,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--ink);
    color:var(--ivory);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.serif{ font-family:'Playfair Display', serif; }
  .eyebrow{
    text-transform:uppercase;
    letter-spacing:0.22em;
    font-size:11px;
    font-weight:600;
    color:var(--brass);
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  img{display:block; max-width:100%;}
  ::selection{background:var(--maroon); color:#FBF9F6;}

  /* reduced motion */
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  :focus-visible{ outline:2px solid var(--brass); outline-offset:3px; }

  /* ---------- Layout shell ---------- */
  .app{min-height:100vh; display:flex; flex-direction:column;}
  .container{ width:100%; max-width:1280px; margin:0 auto; padding:0 28px; }

  /* ---------- Announcement bar ---------- */
  .announce{
    background:var(--maroon); color:#FBF9F6; text-align:center;
    padding:10px 20px; font-size:12px; letter-spacing:0.06em; font-weight:500;
    position:relative; z-index:60;
  }
  .announce b{ color:var(--brass); font-weight:600; }

  /* ---------- Nav ---------- */
  .nav{
    position:sticky; top:0; z-index:50;
    background:rgba(251,249,246,0.92);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{ display:flex; align-items:center; justify-content:space-between; padding:20px 28px; max-width:1280px; margin:0 auto; }
  .brand{ display:flex; flex-direction:column; line-height:1; cursor:pointer; }
  .brand-name{ font-size:22px; font-weight:700; letter-spacing:0.01em; }
  .brand-sub{ font-size:9px; letter-spacing:0.28em; color:var(--brass); text-transform:uppercase; margin-top:4px; }
  .nav-links{ display:flex; gap:36px; align-items:center; }
  .nav-item{ position:relative; }
  .nav-item > a, .nav-item > button{ font-size:13px; letter-spacing:0.04em; color:var(--sand-dim); transition:color .25s; position:relative; display:inline-flex; align-items:center; gap:4px; }
  .nav-item:hover > a, .nav-item:hover > button{ color:var(--ivory); }
  .nav-links a{ font-size:13px; letter-spacing:0.04em; color:var(--sand-dim); transition:color .25s; position:relative; }
  .nav-links a:hover{ color:var(--ivory); }
  .mega-caret{ font-size:9px; transition:transform .2s; }
  .nav-item:hover .mega-caret{ transform:rotate(180deg); }
  .mega-panel{
    position:absolute; top:calc(100% + 18px); left:50%; transform:translateX(-50%);
    background:var(--ink); border:1px solid var(--line); box-shadow:0 24px 48px -16px rgba(0,0,0,0.18);
    padding:20px 24px; min-width:200px; display:none; flex-direction:column; gap:2px; z-index:60;
  }
  .nav-item:hover .mega-panel{ display:flex; }
  .mega-panel a{ padding:8px 4px; font-size:13px; color:var(--sand-dim); white-space:nowrap; border-radius:2px; transition:all .15s; }
  .mega-panel a:hover{ color:var(--maroon); padding-left:8px; }
  .mega-panel .mega-all{ font-weight:600; color:var(--ivory); border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:6px; }
  .nav-right{ display:flex; align-items:center; gap:20px; }
  .icon-btn{ position:relative; color:var(--ivory); padding:4px; display:flex; align-items:center; justify-content:center; }
  .cart-count{
    position:absolute; top:-6px; right:-8px; background:var(--maroon); color:#FBF9F6;
    font-size:10px; font-weight:700; width:17px; height:17px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .burger{ display:none; font-size:22px; }

  @media (max-width:860px){
    .nav-links{ display:none; }
    .burger{ display:block; }
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    padding:110px 28px 70px;
    display:grid; grid-template-columns:1.05fr 0.95fr; gap:56px; align-items:center;
    max-width:1280px; margin:0 auto;
    min-height:78vh;
  }
  @media (max-width:900px){
    .hero{ grid-template-columns:1fr; padding-top:56px; min-height:auto; gap:40px; }
  }
  .hero-eyebrow{ display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .hero-eyebrow .rule{ width:34px; height:1px; background:var(--brass); }
  .hero h1{
    font-size:clamp(42px, 6vw, 72px);
    line-height:1.05;
    font-weight:700;
    letter-spacing:-0.015em;
  }
  .hero h1 em{ font-style:italic; color:var(--brass); font-weight:500; }
  .hero p.lead{
    margin-top:24px; font-size:16.5px; line-height:1.75; color:var(--sand-dim); max-width:440px;
  }
  .hero-ctas{ display:flex; gap:14px; margin-top:38px; flex-wrap:wrap; }
  .hero-trust{ display:flex; gap:28px; margin-top:44px; flex-wrap:wrap; }
  .hero-trust .ht-item{ display:flex; align-items:center; gap:9px; }
  .hero-trust .ht-icon{ font-size:16px; color:var(--brass); }
  .hero-trust .ht-text{ font-size:12px; color:var(--sand-dim); letter-spacing:0.02em; }
  .hero-trust .ht-text strong{ color:var(--ivory); display:block; font-size:13px; font-weight:600; }
  .btn{
    padding:16px 32px; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; font-weight:600;
    transition:all .25s cubic-bezier(.2,.8,.2,1); display:inline-flex; align-items:center; gap:8px; border:1px solid transparent;
  }
  .btn-primary{ background:var(--maroon); color:#FBF9F6; box-shadow:0 1px 0 rgba(255,255,255,0.15) inset, 0 12px 24px -10px rgba(184,126,138,0.5); }
  .btn-primary:hover{ background:var(--maroon-light); transform:translateY(-2px); box-shadow:0 1px 0 rgba(255,255,255,0.15) inset, 0 18px 30px -10px rgba(184,126,138,0.55); }
  .btn-outline{ border-color:var(--line); color:var(--ivory); }
  .btn-outline:hover{ border-color:var(--brass); color:var(--brass); background:rgba(176,141,87,0.06); }

  .hero-stage{
    perspective:1400px;
    display:flex; align-items:center; justify-content:center;
    height:520px;
  }
  @media (max-width:900px){ .hero-stage{ height:380px; } }
  .drape-wrap{
    position:relative; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    transform-style:preserve-3d;
    animation:floatY 6s ease-in-out infinite;
  }
  .drape-card{
    width:300px; height:420px;
    border-radius:4px;
    background:linear-gradient(155deg, var(--maroon) 0%, #5c2020 55%, #3a1414 100%);
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.7), inset 0 0 60px rgba(176,141,87,0.08);
    transform: rotateY(-18deg) rotateX(6deg);
    position:relative;
    overflow:hidden;
    animation:rotateDrape 14s ease-in-out infinite;
    border:1px solid rgba(176,141,87,0.25);
  }
  .drape-card--photo img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  .drape-card--photo::before{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(21,19,15,0) 40%, rgba(21,19,15,0.85) 100%);
    z-index:1;
  }
  .drape-card--photo .drape-label{ z-index:2; }
  .drape-card::before{
    content:'';
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(115deg, rgba(243,237,227,0.05) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(25deg, rgba(0,0,0,0.12) 0 3px, transparent 3px 34px);
  }
  .drape-card::after{
    content:'';
    position:absolute; top:0; left:-40%; width:40%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(243,237,227,0.12), transparent);
    animation:sheen 5s ease-in-out infinite;
  }
  .drape-label{
    position:absolute; bottom:22px; left:22px; right:22px;
    color:#F3EDE3;
  }
  .drape-label .eyebrow{ color:#D9A5AE; opacity:0.9; }
  .drape-label .title{ font-family:'Playfair Display',serif; font-size:20px; margin-top:6px; color:#F3EDE3; }
  .drape-back{
    position:absolute; width:260px; height:380px; border-radius:4px;
    background:linear-gradient(155deg, #2a2620, #1a1712);
    border:1px solid var(--line);
    transform: translateZ(-90px) translateX(60px) rotateY(-18deg) rotateX(6deg);
    opacity:0.7;
  }
  @keyframes floatY{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-14px);} }
  @keyframes rotateDrape{
    0%,100%{ transform:rotateY(-18deg) rotateX(6deg);}
    50%{ transform:rotateY(-6deg) rotateX(3deg);}
  }
  @keyframes sheen{ 0%{ left:-40%;} 60%,100%{ left:120%;} }

  .orbit-dot{
    position:absolute; width:8px; height:8px; border-radius:50%; background:var(--brass);
    box-shadow:0 0 16px 4px rgba(176,141,87,0.5);
  }

  /* ---------- Trust strip ---------- */
  .trust-strip{ border-bottom:1px solid var(--line); }
  .trust-grid{ display:grid; grid-template-columns:repeat(4,1fr); }
  @media (max-width:760px){ .trust-grid{ grid-template-columns:repeat(2,1fr); } }
  .trust-cell{
    display:flex; align-items:center; gap:14px; padding:26px 28px;
    border-right:1px solid var(--line);
  }
  .trust-cell:nth-child(4){ border-right:none; }
  @media (max-width:760px){ .trust-cell:nth-child(2){ border-right:none; } .trust-cell:nth-child(3){ border-right:1px solid var(--line); } }
  .trust-cell .tc-icon{ color:var(--brass); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .trust-cell .tc-title{ font-size:12.5px; font-weight:600; }
  .trust-cell .tc-sub{ font-size:11px; color:var(--sand-dim); margin-top:2px; }

  /* ---------- Marquee strip ---------- */
  .marquee-strip{
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:16px 0; overflow:hidden; white-space:nowrap; background:rgba(42,39,36,0.02);
  }
  .marquee-track{ display:inline-flex; gap:60px; animation:marquee 28s linear infinite; }
  .marquee-track span{ font-family:'Playfair Display',serif; font-style:italic; font-size:15px; color:var(--sand-dim); letter-spacing:0.02em; }
  @keyframes marquee{ from{ transform:translateX(0);} to{ transform:translateX(-50%);} }

  /* ---------- Section headers ---------- */
  .section{ padding:100px 0; }
  .section-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:52px; gap:20px; flex-wrap:wrap; }
  .section-head h2{ font-size:clamp(30px,3.6vw,42px); font-weight:600; margin-top:12px; letter-spacing:-0.01em; }
  .section-head .view-all{ font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--brass); border-bottom:1px solid var(--brass); padding-bottom:4px; transition:opacity .2s; }
  .section-head .view-all:hover{ opacity:0.7; }

  /* ---------- Product grid ---------- */
  .grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:32px 28px; }
  @media (max-width:1000px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .grid{ grid-template-columns:1fr; } }

  .card{
    cursor:pointer;
    perspective:1000px;
  }
  .card-media{
    aspect-ratio:3/4;
    position:relative;
    overflow:hidden;
    background:var(--sand);
    border-radius:3px;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s ease;
    box-shadow:0 1px 2px rgba(0,0,0,0.2);
  }
  .card:hover .card-media{ transform:rotateY(-5deg) rotateX(1.5deg) scale(1.015); box-shadow:0 30px 50px -20px rgba(0,0,0,0.6); }
  .card-media img{ width:100%; height:100%; object-fit:cover; transition:transform .7s cubic-bezier(.2,.8,.2,1); }
  .card:hover .card-media img{ transform:scale(1.07); }
  .card-media .tag{
    position:absolute; top:14px; left:14px; background:rgba(21,19,15,0.85); backdrop-filter:blur(6px); color:var(--brass);
    font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; padding:7px 11px; font-weight:600;
  }
  .card-media .wishlist{
    position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%;
    background:rgba(21,19,15,0.6); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center;
    font-size:14px; opacity:0; transition:opacity .25s ease; color:#F3EDE3;
  }
  .card:hover .card-media .wishlist{ opacity:1; }
  .card-quickadd{
    position:absolute; bottom:0; left:0; right:0; background:rgba(21,19,15,0.95); backdrop-filter:blur(8px);
    padding:13px; text-align:center; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;
    transform:translateY(100%); transition:transform .35s cubic-bezier(.2,.8,.2,1); color:#F3EDE3; font-weight:600;
    border-top:1px solid rgba(176,141,87,0.25);
  }
  .card:hover .card-quickadd{ transform:translateY(0); }
  .card-info{ padding-top:16px; }
  .card-info .ccat{ font-size:10px; color:var(--brass); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:5px; display:block; }
  .card-info .cname{ font-family:'Playfair Display',serif; font-size:16.5px; line-height:1.3; }
  .card-info .cmeta{ display:flex; justify-content:space-between; align-items:center; margin-top:9px; }
  .card-info .cprice{ color:var(--ivory); font-size:14.5px; font-weight:600; }
  .price-row{ display:flex; align-items:baseline; gap:8px; }
  .price-original{ color:var(--sand-dim); font-size:12px; text-decoration:line-through; }
  .sale-badge{
    position:absolute; top:14px; right:14px; background:var(--maroon); color:#FBF9F6;
    font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; padding:6px 10px; font-weight:700;
  }
  .pd-price-row{ display:flex; align-items:baseline; gap:14px; margin-bottom:24px; }
  .pd-price-original{ color:var(--sand-dim); font-size:16px; text-decoration:line-through; }
  .card-info .cstars{ font-size:11px; }

  .empty-state{
    text-align:center; padding:70px 20px; border:1px dashed var(--line); color:var(--sand-dim);
  }
  .empty-state h3{ color:var(--ivory); margin-bottom:10px; font-size:22px; }

  /* ---------- Filter bar ---------- */
  .filter-bar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:40px; }
  .chip{
    padding:9px 18px; border:1px solid var(--line); font-size:12px; letter-spacing:0.05em; text-transform:uppercase;
    transition:all .2s;
  }
  .chip.active, .chip:hover{ border-color:var(--brass); color:var(--brass); }
  .search-input{
    flex:1; min-width:200px; background:transparent; border:1px solid var(--line); color:var(--ivory);
    padding:9px 16px; font-size:13px;
  }
  .search-input::placeholder{ color:var(--sand-dim); }

  /* ---------- Footer ---------- */
  .footer{ border-top:1px solid var(--line); padding:60px 0 30px; margin-top:60px; }
  .footer-grid{ display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:40px; margin-bottom:50px; }
  @media (max-width:760px){ .footer-grid{ grid-template-columns:1fr 1fr; } }
  .footer h4{ font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--brass); margin-bottom:16px; }
  .footer ul{ list-style:none; display:flex; flex-direction:column; gap:10px; }
  .footer ul a{ font-size:13.5px; color:var(--sand-dim); }
  .footer ul a:hover{ color:var(--ivory); }
  .footer-bottom{ display:flex; justify-content:space-between; padding-top:24px; border-top:1px solid var(--line); font-size:12px; color:var(--sand-dim); flex-wrap:wrap; gap:10px; }

  /* ---------- Product detail ---------- */
  .pd-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:60px; padding:60px 0 100px; }
  @media (max-width:860px){ .pd-wrap{ grid-template-columns:1fr; gap:32px; padding-top:30px; } }
  .pd-media{
    aspect-ratio:4/5; background:var(--sand); overflow:hidden; perspective:1200px; border-radius:2px;
  }
  .pd-media img{ width:100%; height:100%; object-fit:cover; }
  .pd-info .eyebrow{ margin-bottom:10px; }
  .pd-info h1{ font-size:clamp(28px,4vw,42px); margin-bottom:14px; }
  .pd-price{ font-size:22px; color:var(--brass); font-weight:600; margin-bottom:24px; }
  .pd-desc{ color:var(--sand-dim); line-height:1.8; font-size:14.5px; margin-bottom:30px; max-width:480px; }
  .pd-meta-row{ display:flex; gap:30px; margin-bottom:30px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:20px 0; }
  .pd-meta-row div span{ display:block; }
  .pd-meta-row .k{ font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--sand-dim); margin-bottom:6px; }
  .pd-meta-row .v{ font-size:14px; }
  .qty-row{ display:flex; align-items:center; gap:16px; margin-bottom:26px; }
  .qty-box{ display:flex; align-items:center; border:1px solid var(--line); }
  .qty-box button{ padding:10px 16px; font-size:16px; }
  .qty-box span{ padding:0 14px; min-width:30px; text-align:center; }
  .pd-actions{ display:flex; gap:14px; flex-wrap:wrap; }
  .back-link{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px; letter-spacing:0.05em; text-transform:uppercase; color:var(--sand-dim); margin:26px 0 0; }
  .back-link:hover{ color:var(--ivory); }

  /* ---------- Size chart ---------- */
  .size-chart-toggle{
    display:flex; align-items:center; gap:8px; font-size:12.5px; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--brass); border-bottom:1px solid var(--brass); padding-bottom:3px; margin-bottom:20px; width:fit-content;
  }
  .size-chart-table{ width:100%; border-collapse:collapse; margin-bottom:26px; font-size:13px; }
  .size-chart-table th, .size-chart-table td{ border:1px solid var(--line); padding:10px 12px; text-align:center; }
  .size-chart-table th{ background:rgba(176,141,87,0.08); color:var(--brass); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; }
  .size-chart-table td:first-child, .size-chart-table th:first-child{ text-align:left; color:var(--sand-dim); }

  /* ---------- Reviews ---------- */
  .reviews-section{ margin-top:60px; border-top:1px solid var(--line); padding-top:40px; }
  .reviews-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:14px; }
  .reviews-head h3{ font-size:22px; }
  .review-card{ border-bottom:1px solid var(--line); padding:20px 0; }
  .review-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; gap:10px; }
  .review-name{ font-weight:600; font-size:14px; }
  .review-date{ font-size:11.5px; color:var(--sand-dim); }
  .review-text{ color:var(--sand-dim); font-size:13.5px; line-height:1.7; margin-top:6px; }
  .review-form{ border:1px solid var(--line); padding:24px; margin-top:20px; }
  .review-form h4{ font-size:15px; margin-bottom:18px; }
  .star-picker{ display:flex; gap:6px; margin-bottom:18px; }
  .star-picker button{ font-size:24px; color:var(--sand-dim); transition:color .15s; }
  .star-picker button.active{ color:var(--brass); }
  .no-reviews{ color:var(--sand-dim); font-size:13.5px; padding:20px 0; }

  /* ---------- FAQ ---------- */
  .faq-item{ border-bottom:1px solid var(--line); }

const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ---------------- Placeholder image generator (styled SVG "photography") ---------------- */
function placeholderImg(seed, w=700, h=900){
  const palettes = [
    { base:'#8a3535', mid:'#5c2222', deep:'#2a1010', light:'#c48a5a' },
    { base:'#b8935f', mid:'#8a6b3e', deep:'#3d2e18', light:'#e8d4b0' },
    { base:'#4a5a45', mid:'#2f3a2b', deep:'#151b13', light:'#a8b89a' },
    { base:'#5a4a6b', mid:'#3a3048', deep:'#191420', light:'#b8a8c8' },
    { base:'#6b4a35', mid:'#452f20', deep:'#1e140d', light:'#c9a878' },
    { base:'#3a4f5f', mid:'#243440', deep:'#0f1a20', light:'#8fb0c0' },
  ];
  let hash = 0;
  for(let i=0;i<seed.length;i++){ hash = seed.charCodeAt(i) + ((hash<<5)-hash); }
  const p = palettes[Math.abs(hash) % palettes.length];
  const seed2 = Math.abs(hash) % 100;
  // fold-line positions to fake garment drape structure
  const folds = Array.from({length:6}).map((_,i)=>{
    const x = (w/6)*i + (seed2 % 20);
    const curve = 30 + (i%3)*18;
    return `M${x},0 C${x+curve},${h*0.35} ${x-curve},${h*0.65} ${x},${h}`;
  });
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}' viewBox='0 0 ${w} ${h}'>
    <defs>
      <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
        <stop offset='0%' stop-color='${p.base}'/>
        <stop offset='55%' stop-color='${p.mid}'/>
        <stop offset='100%' stop-color='${p.deep}'/>
      </linearGradient>
      <radialGradient id='vin' cx='50%' cy='35%' r='75%'>
        <stop offset='0%' stop-color='#000' stop-opacity='0'/>
        <stop offset='100%' stop-color='#000' stop-opacity='0.45'/>
      </radialGradient>
      <linearGradient id='sheen' x1='0' y1='0' x2='1' y2='0.3'>
        <stop offset='0%' stop-color='#fff' stop-opacity='0'/>
        <stop offset='45%' stop-color='#fff' stop-opacity='0.12'/>
        <stop offset='60%' stop-color='#fff' stop-opacity='0'/>
      </linearGradient>
    </defs>
    <rect width='${w}' height='${h}' fill='url(#bg)'/>
    ${folds.map((d,i)=>`<path d='${d}' fill='none' stroke='${i%2===0?p.deep:p.light}' stroke-opacity='${i%2===0?0.35:0.18}' stroke-width='${18+i*3}'/>`).join('')}
    <rect width='${w}' height='${h}' fill='url(#sheen)'/>
    <rect width='${w}' height='${h}' fill='url(#vin)'/>
    <circle cx='${w*0.78}' cy='${h*0.22}' r='${w*0.16}' fill='${p.light}' opacity='0.08'/>
  </svg>`;
  return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
}

/* ---------------- Supabase setup ---------------- */
const SUPABASE_URL = 'https://qkysezjkclpclkmrnops.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DK4vPx2YLcWKRqts_McmFQ_A2JHTyQ-';

let supabaseClient = null;
let supabaseInitError = null;
try{
  if(!window.supabase || !window.supabase.createClient){
    throw new Error('Supabase SDK did not load from CDN. Check your internet connection or ad-blocker and refresh.');
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}catch(e){
  supabaseInitError = e.message;
  console.error('Supabase init failed:', e);
}

/* Map a Supabase row (image_url: string) to the app's product shape (images: array) */
function rowToProduct(row){
  return {
    id: String(row.id),
    name: row.name || '',
    category: row.category || CATEGORIES[0],
    price: Number(row.price) || 0,
    originalPrice: row.original_price ? Number(row.original_price) : null,
    desc: row.description || '',
    fabric: row.fabric || '',
    images: row.image_url ? [row.image_url] : [placeholderImg(row.name || 'product')],
    featured: !!row.featured,
    rating: row.rating || 4,
  };
}

/* Map the app's product shape back to a Supabase row for insert/update */
function productToRow(p){
  return {
    name: p.name,
    category: p.category,
    price: p.price,
    original_price: p.originalPrice || null,
    description: p.desc,
    image_url: p.images && p.images[0] ? p.images[0] : null,
    featured: !!p.featured,
  };
}

/* ---------------- Storage helpers (Supabase-backed) ---------------- */
async function loadProducts(){
  if(!supabaseClient) return { error: supabaseInitError || 'Supabase client not initialized', data: [] };
  try{
    const { data, error } = await supabaseClient.from('products').select('*').order('id', { ascending:false });
    if(error){ console.error('Supabase load error:', error); return { error: error.message, data: [] }; }
    return { error: null, data: (data || []).map(rowToProduct) };
  }catch(e){
    console.error('Supabase load exception:', e);
    return { error: e.message, data: [] };
  }
}

async function insertProduct(p){
  if(!supabaseClient) throw new Error(supabaseInitError || 'Supabase not initialized');
  const { data, error } = await supabaseClient.from('products').insert([productToRow(p)]).select();
  if(error){ console.error('Supabase insert error:', error); throw error; }
  return data && data[0] ? rowToProduct(data[0]) : null;
}

async function updateProductRow(id, p){
  if(!supabaseClient) throw new Error(supabaseInitError || 'Supabase not initialized');
  const { data, error } = await supabaseClient.from('products').update(productToRow(p)).eq('id', id).select();
  if(error){ console.error('Supabase update error:', error); throw error; }
  return data && data[0] ? rowToProduct(data[0]) : null;
}

async function deleteProductRow(id){
  if(!supabaseClient) throw new Error(supabaseInitError || 'Supabase not initialized');
  const { error } = await supabaseClient.from('products').delete().eq('id', id);
  if(error){ console.error('Supabase delete error:', error); throw error; }
}

/* ---------------- Reviews ---------------- */

  if(!supabaseClient) return [];
  try{
    const { data, error } = await supabaseClient.from('reviews').select('*').eq('product_id', productId).order('created_at', { ascending:false });
    if(error){ console.error('Supabase reviews load error:', error); return []; }
    return data || [];
  }catch(e){
    console.error('Supabase reviews load exception:', e);
    return [];
  }
}

async function insertReview(review){
  if(!supabaseClient) throw new Error(supabaseInitError || 'Supabase not initialized');
  const { data, error } = await supabaseClient.from('reviews').insert([review]).select();
  if(error){ console.error('Supabase review insert error:', error); throw error; }

}

/* Cart stays local to the browser (no login system), so localStorage-free in-memory + simple persistence via window.storage if available, else memory only */
async function loadCart(){
  try{
    const res = await window.storage.get('cart', false);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){}
  return [];
}
async function saveCart(cart){
  try{ await window.storage.set('cart', JSON.stringify(cart), false); }catch(e){}
}

/* ---------------- Toast ---------------- */
function useToast(){
  const [msg, setMsg] = useState('');
  const [show, setShow] = useState(false);
  const fire = useCallback((m)=>{
    setMsg(m); setShow(true);
    setTimeout(()=>setShow(false), 2200);
  },[]);
  const node = <div className={`toast ${show?'show':''}`}>{msg}</div>;
  return [fire, node];
}

const ANNOUNCE_MESSAGES = [

function Shop({ products, params, go, onQuickAdd }){
  const [cat, setCat] = useState(params?.cat || 'all');
  const [sub, setSub] = useState(params?.sub || 'all');
  const [q, setQ] = useState('');
  useEffect(()=>{ setCat(params?.cat || 'all'); setSub(params?.sub || 'all'); }, [params]);

  const filtered = useMemo(()=>{
    return products.filter(p=>{
      const catOk = cat==='all' || p.category===cat;
      const subOk = sub==='all' || (p.name.toLowerCase().includes(sub.toLowerCase()) || (p.desc||'').toLowerCase().includes(sub.toLowerCase()));
      const qOk = q.trim()==='' || p.name.toLowerCase().includes(q.toLowerCase()) || p.category.toLowerCase().includes(q.toLowerCase());
      return catOk && subOk && qOk;
    });
  }, [products, cat, sub, q]);

  return (
    <div className="container section">
      <div className="section-head">
        <div><span className="eyebrow">Full Collection</span><h2>{sub!=='all' ? sub : 'Shop All'}</h2></div>
      </div>

          <button key={c} className={`chip ${cat===c?'active':''}`} onClick={()=>{setCat(c); setSub('all');}}>{c}</button>
        ))}
        <input className="search-input" placeholder="Search products..." value={q} onChange={e=>setQ(e.target.value)} />
      </div>
      {sub!=='all' && (
        <div style={{marginBottom:24, fontSize:12.5, color:'var(--sand-dim)'}}>

          <button onClick={()=>setSub('all')} style={{marginLeft:10, color:'var(--maroon)', textDecoration:'underline'}}>Clear</button>
        </div>
      )}
      {filtered.length===0 ? (
        <div className="empty-state"><h3>No products found</h3><p>Try a different filter or search term.</p></div>

        <div className="grid">
          {filtered.map(p=>(<ProductCard key={p.id} p={p} go={go} onQuickAdd={onQuickAdd} />))}
        </div>
      )}
    </div>
  );

/* ---------------- Checkout ---------------- */
function Checkout({ cart, products, go, clearCart }){
  const items = cart.map(ci=>({ ...ci, product: products.find(p=>p.id===ci.id) })).filter(x=>x.product);
  const total = items.reduce((s,x)=>s + x.product.price * x.qty, 0);
  const [form, setForm] = useState({ name:'', phone:'', address:'', city:'' });
  const [placed, setPlaced] = useState(false);

  useEffect(()=>{
    if(items.length===0 && !placed) go('shop',{cat:'all'});
  }, []);

  const placeOrder = (e) => {
    e.preventDefault();
    if(!form.name.trim() || !form.phone.trim() || !form.address.trim() || !form.city.trim()) return;
    let lines = items.map(x=>`• ${x.product.name} × ${x.qty} — Rs. ${(x.product.price*x.qty).toLocaleString()}`).join('\n');
    const msg = encodeURIComponent(
      `Hi, I'd like to place an order:\n\n${lines}\n\nTotal: Rs. ${total.toLocaleString()}\n\nName: ${form.name}\nPhone: ${form.phone}\nAddress: ${form.address}\nCity: ${form.city}`
    );
    window.open(`https://wa.me/923701672013?text=${msg}`, '_blank');
    setPlaced(true);
    clearCart();
  };

  if(placed){
    return (
      <div className="container">
        <div className="co-success">
          <div className="check"><span style={{fontSize:26}}>✓</span></div>
          <h2 className="serif" style={{fontSize:28, marginBottom:12}}>Order sent!</h2>
          <p style={{color:'var(--sand-dim)', maxWidth:400, margin:'0 auto 24px'}}>We've opened WhatsApp with your order details. Send the message to confirm — we'll reply to finalize delivery.</p>
          <button className="btn btn-primary" onClick={()=>go('shop',{cat:'all'})}>Continue Shopping</button>
        </div>
      </div>
    );
  }

  if(items.length===0) return null;

  return (
    <div className="container">
      <a className="back-link" href="#" onClick={(e)=>{e.preventDefault(); go('shop',{cat:'all'});}}>← Back to shop</a>
      <div className="checkout-wrap">
        <div>
          <span className="eyebrow">Almost there</span>
          <h1 className="serif" style={{fontSize:'clamp(26px,3.5vw,36px)', margin:'12px 0 30px'}}>Delivery Details</h1>
          <form onSubmit={placeOrder}>
            <div className="field">
              <label>Full Name</label>
              <input value={form.name} onChange={e=>setForm(f=>({...f, name:e.target.value}))} placeholder="Your full name" required />
            </div>
            <div className="field">
              <label>Phone Number</label>
              <input type="tel" value={form.phone} onChange={e=>setForm(f=>({...f, phone:e.target.value}))} placeholder="03XX-XXXXXXX" required />
            </div>
            <div className="field">
              <label>Delivery Address</label>
              <textarea value={form.address} onChange={e=>setForm(f=>({...f, address:e.target.value}))} placeholder="House/street, area, landmark" required />
            </div>
            <div className="field">
              <label>City</label>
              <input value={form.city} onChange={e=>setForm(f=>({...f, city:e.target.value}))} placeholder="e.g. Lahore" required />
            </div>
            <button className="btn btn-primary" type="submit" style={{width:'100%', justifyContent:'center', marginTop:8}}>Place Order via WhatsApp</button>
            <p style={{fontSize:11.5, color:'var(--sand-dim)', marginTop:14, textAlign:'center'}}>Cash on Delivery — no payment needed now. We'll confirm your order on WhatsApp.</p>
          </form>
        </div>
        <div className="checkout-summary">
          <h3 className="serif">Order Summary</h3>
          {items.map(x=>(
            <div className="co-item" key={x.id}>
              <div>
                <div className="co-name">{x.product.name}</div>
                <div className="co-qty">Qty {x.qty}</div>
              </div>
              <div>Rs. {(x.product.price*x.qty).toLocaleString()}</div>
            </div>
          ))}
          <div className="co-total-row"><span>Total</span><strong>Rs. {total.toLocaleString()}</strong></div>
        </div>
      </div>
    </div>
  );
}

function ReviewForm({ productId, onSubmitted }){
  const [name, setName] = useState('');
  const [rating, setRating] = useState(5);
  const [comment, setComment] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const [err, setErr] = useState('');

  const submit = async (e) => {
    e.preventDefault();
    if(!name.trim() || !comment.trim()) return;
    setSubmitting(true);
    setErr('');
    try{
      const saved = await insertReview({ product_id: productId, name: name.trim(), rating, comment: comment.trim() });
      if(saved){
        onSubmitted(saved);
        setName(''); setComment(''); setRating(5);
      }
    }catch(e){
      setErr("Couldn't submit review — try again.");
    }
    setSubmitting(false);
  };

  return (
    <form className="review-form" onSubmit={submit}>
      <h4 className="serif">Write a Review</h4>
      <div className="star-picker">
        {[1,2,3,4,5].map(n=>(
          <button type="button" key={n} className={n<=rating?'active':''} onClick={()=>setRating(n)} aria-label={`${n} stars`}>★</button>
        ))}
      </div>
      <div className="field">
        <label>Your Name</label>
        <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your Name" required />
      </div>
      <div className="field">
        <label>Your Review</label>
        <textarea value={comment} onChange={e=>setComment(e.target.value)} placeholder="How was the fabric, fit, and quality?" required />
      </div>
      <button className="btn btn-primary" type="submit" disabled={submitting}>{submitting ? 'Submitting…' : 'Submit Review'}</button>
      {err && <div className="admin-error">{err}</div>}
    </form>
  );
}

function ReviewsSection({ productId }){
  const [reviews, setReviews] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);

  useEffect(()=>{
    let active = true;
    setLoading(true);
    loadReviews(productId).then(data=>{ if(active){ setReviews(data); setLoading(false); } });
    return ()=>{ active = false; };
  }, [productId]);

  const avgRating = reviews.length ? (reviews.reduce((s,r)=>s+r.rating,0) / reviews.length) : 0;

  return (
    <div className="reviews-section">
      <div className="reviews-head">
        <div>
          <h3 className="serif">Customer Reviews</h3>
          {reviews.length>0 && (
            <div style={{display:'flex', alignItems:'center', gap:8, marginTop:6}}>
              <Stars n={Math.round(avgRating)} />
              <span style={{fontSize:12.5, color:'var(--sand-dim)'}}>{avgRating.toFixed(1)} out of 5 ({reviews.length} review{reviews.length!==1?'s':''})</span>
            </div>
          )}
        </div>
        <button className="btn btn-outline" onClick={()=>setShowForm(v=>!v)}>{showForm ? 'Cancel' : 'Write a Review'}</button>
      </div>

      {showForm && (
        <ReviewForm productId={productId} onSubmitted={(newReview)=>{ setReviews(r=>[newReview, ...r]); setShowForm(false); }} />
      )}

      {loading ? (
        <p className="no-reviews">Loading reviews…</p>

        <p className="no-reviews">No reviews yet — be the first to share your experience.</p>
      ) : (
        <div>
          {reviews.map(r=>(
            <div className="review-card" key={r.id}>

                <div>
                  <div className="review-name">{r.name}</div>

  const [qty, setQty] = useState(1);
  const [activeImg, setActiveImg] = useState(0);
  useEffect(()=>{ setQty(1); setActiveImg(0); }, [params]);

  if(!p) return (
    <div className="container section">
      <div className="empty-state"><h3>Product not found</h3><a className="back-link" href="#" onClick={(e)=>{e.preventDefault(); go('shop',{cat:'all'});}}>← Back to shop</a></div>
    </div>
  );

  return (
    <div className="container">
      <a className="back-link" href="#" onClick={(e)=>{e.preventDefault(); go('shop',{cat:'all'});}}>← Back to shop</a>
      <div className="pd-wrap">
        <div>
          <div className="pd-media"><img src={p.images[activeImg]} alt={p.name} /></div>
          {p.images.length>1 && (
            <div style={{display:'flex', gap:10, marginTop:12}}>
              {p.images.map((img,i)=>(
                <div key={i} onClick={()=>setActiveImg(i)} style={{width:64, height:80, cursor:'pointer', opacity: i===activeImg?1:0.5, border: i===activeImg ? '1px solid var(--brass)' : '1px solid transparent'}}>
                  <img src={img} style={{width:'100%', height:'100%', objectFit:'cover'}} />
                </div>
              ))}
            </div>
          )}
        </div>
        <div className="pd-info">
          <span className="eyebrow">{p.category}</span>
          <h1 className="serif">{p.name}</h1>
          <div style={{display:'flex', alignItems:'center', gap:10, marginTop:10}}>
            <Stars n={p.rating || 4} />
            <span style={{fontSize:12.5, color:'var(--sand-dim)'}}>({Math.floor((p.id.charCodeAt(1)||50) * 3.7)} reviews)</span>
          </div>
          <div className="pd-price-row" style={{marginTop:18, marginBottom:0}}>
            <span className="pd-price" style={{marginBottom:0}}>Rs. {p.price.toLocaleString()}</span>
            {p.originalPrice && p.originalPrice > p.price && (
              <React.Fragment>
                <span className="pd-price-original">Rs. {p.originalPrice.toLocaleString()}</span>
                <span className="sale-badge" style={{position:'static'}}>Sale</span>
              </React.Fragment>
            )}
          </div>
          <p className="pd-desc" style={{marginTop:24}}>{p.desc}</p>
          <SizeChart category={p.category} />
          <div className="pd-meta-row">
            <div><span className="k">Fabric</span><span className="v">{p.fabric || '—'}</span></div>
            <div><span className="k">Category</span><span className="v">{p.category}</span></div>
            <div><span className="k">Delivery</span><span className="v">3–5 Days</span></div>
          </div>
          <div className="qty-row">
            <div className="qty-box">
              <button onClick={()=>setQty(q=>Math.max(1,q-1))} aria-label="Decrease quantity">−</button>
              <span>{qty}</span>
              <button onClick={()=>setQty(q=>q+1)} aria-label="Increase quantity">+</button>
            </div>
          </div>
          <div className="pd-actions">
            <button className="btn btn-primary" onClick={()=>onAddToCart(p, qty)}>Add to Cart</button>
            <button className="btn btn-outline" onClick={()=>{
              const msg = encodeURIComponent(`Hi, I'd like to order:\n${p.name} × ${qty}\nPrice: Rs. ${(p.price*qty).toLocaleString()}`);
              window.open(`https://wa.me/923701672013?text=${msg}`, '_blank');
            }}>Order on WhatsApp</button>
          </div>
        </div>
      </div>
      <ReviewsSection productId={p.id} />
    </div>
  );
}

/* ---------------- Cart Drawer ---------------- */
function CartDrawer({ open, close, cart, updateQty, removeItem, products, go }){
  const items = cart.map(ci=>({ ...ci, product: products.find(p=>p.id===ci.id) })).filter(x=>x.product);
  const total = items.reduce((s,x)=>s + x.product.price * x.qty, 0);

  const goToCheckout = () => {
    if(items.length===0) return;
    close();
    go('checkout');
  };

  return (
    <React.Fragment>
      <div className={`overlay ${open?'open':''}`} onClick={close}></div>
      <div className={`drawer ${open?'open':''}`}>
        <div className="drawer-head">
          <h3 className="serif">Your Bag ({items.length})</h3>
          <button onClick={close} style={{fontSize:20}} aria-label="Close cart">✕</button>
        </div>
        <div className="drawer-body">
          {items.length===0 ? (
            <div className="empty-state"><h3>Your bag is empty</h3><p>Add something beautiful.</p></div>
          ) : items.map(x=>(
            <div className="cart-item" key={x.id}>
              <img src={x.product.images[0]} alt={x.product.name} />
              <div className="ci-info">
                <div className="ci-name serif">{x.product.name}</div>
                <div className="ci-meta">{x.product.category}</div>
                <div className="ci-row">
                  <div className="qty-box">
                    <button onClick={()=>updateQty(x.id, Math.max(1, x.qty-1))}>−</button>
                    <span>{x.qty}</span>
                    <button onClick={()=>updateQty(x.id, x.qty+1)}>+</button>
                  </div>
                  <button className="ci-remove" onClick={()=>removeItem(x.id)}>Remove</button>
                </div>
              </div>
            </div>
          ))}
        </div>
        {items.length>0 && (
          <div className="drawer-foot">
            <div className="sub-row"><span>Subtotal</span><strong>Rs. {total.toLocaleString()}</strong></div>
            <button className="btn btn-primary" onClick={goToCheckout}>Proceed to Checkout</button>
            <button className="btn btn-outline" onClick={close}>Continue Shopping</button>
          </div>
        )}
      </div>
    </React.Fragment>
  );
}

/* ---------------- Admin: Login ---------------- */
function AdminLogin({ onSuccess }){
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setErr('');
    if(!supabaseClient){ setErr('Connection not ready — refresh and try again.'); return; }
    setLoading(true);
    try{
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
      if(error){ setErr('Incorrect email or password.'); setLoading(false); return; }
      onSuccess();
    }catch(e){
      setErr('Something went wrong. Try again.');
    }
    setLoading(false);
  };

  return (
    <div className="admin-login">
      <div className="login-card">
        <span className="eyebrow">Store Admin</span>
        <h2 className="serif" style={{marginTop:10, marginBottom:26}}>Sign in</h2>
        <form onSubmit={submit}>
          <div className="field">
            <label>Email</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" autoFocus required />
          </div>
          <div className="field">
            <label>Password</label>
            <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="Enter your password" required />
          </div>
          <button className="btn btn-primary" type="submit" style={{width:'100%', justifyContent:'center'}} disabled={loading}>{loading ? 'Signing in…' : 'Sign In'}</button>
          {err && <div className="admin-error">{err}</div>}
        </form>
      </div>
    </div>
  );
}

/* ---------------- Admin: Product Form ---------------- */
function emptyProduct(){
  return { id:'', name:'', category:CATEGORIES[0], price:'', originalPrice:'', desc:'', fabric:'', images:[], featured:false, rating:5 };
}

function ProductForm({ initial, onSave, onCancel }){
  const [form, setForm] = useState(initial || emptyProduct());
  const fileRef = useRef(null);

  const handleFiles = (files) => {
    Array.from(files).forEach(file=>{
      const reader = new FileReader();
      reader.onload = (e) => {
        setForm(f=>({ ...f, images:[...f.images, e.target.result] }));
      };
      reader.readAsDataURL(file);
    });
  };

  const removeImage = (idx) => {
    setForm(f=>({ ...f, images:f.images.filter((_,i)=>i!==idx) }));
  };

  const submit = (e) => {
    e.preventDefault();
    if(!form.name.trim() || !form.price){ return; }
    const finalImages = form.images.length ? form.images : [placeholderImg(form.name||'product')];
    onSave({
      ...form,
      id: form.id || ('p_' + Date.now()),
      price: Number(form.price),
      originalPrice: form.originalPrice ? Number(form.originalPrice) : null,
      images: finalImages,
    });
  };

  return (
    <div className="admin-panel-box">
      <h3 className="serif">{initial ? 'Edit Product' : 'Add New Product'}</h3>
      <form onSubmit={submit}>
        <div className="field-row">
          <div className="field">
            <label>Product Name</label>
            <input value={form.name} onChange={e=>setForm(f=>({...f, name:e.target.value}))} placeholder="e.g. Zareen Embroidered Lawn" required />
          </div>
          <div className="field">
            <label>Price (PKR)</label>
            <input type="number" min="0" value={form.price} onChange={e=>setForm(f=>({...f, price:e.target.value}))} placeholder="e.g. 4500" required />
          </div>
        </div>
        <div className="field-row">
          <div className="field">
            <label>Original Price (Optional — for Sale badge)</label>
            <input type="number" min="0" value={form.originalPrice} onChange={e=>setForm(f=>({...f, originalPrice:e.target.value}))} placeholder="e.g. 5500 (leave blank if not on sale)" />
          </div>
          <div></div>
        </div>
        <div className="field-row">
          <div className="field">
            <label>Category</label>
            <select value={form.category} onChange={e=>setForm(f=>({...f, category:e.target.value}))}>
              {CATEGORIES.map(c=>(<option key={c} value={c}>{c}</option>))}
            </select>
          </div>
          <div className="field">
            <label>Fabric</label>
            <input value={form.fabric} onChange={e=>setForm(f=>({...f, fabric:e.target.value}))} placeholder="e.g. Pure Lawn" />
          </div>
        </div>
        <div className="field">
          <label>Description</label>
          <textarea value={form.desc} onChange={e=>setForm(f=>({...f, desc:e.target.value}))} placeholder="Describe the fabric, fit, and details customers should know..." />
        </div>
        <div className="field">
          <label>Product Images</label>
          <div className="upload-box" onClick={()=>fileRef.current.click()}>
            Click to upload images (or drag files here)
          </div>
          <input ref={fileRef} type="file" accept="image/*" multiple style={{display:'none'}} onChange={e=>handleFiles(e.target.files)} />
          {form.images.length>0 && (
            <div className="img-upload-preview">
              {form.images.map((img,i)=>(
                <div className="thumb" key={i}>
                  <img src={img} />
                  <button type="button" className="rm" onClick={()=>removeImage(i)}>✕</button>
                </div>
              ))}
            </div>
          )}
          <p style={{fontSize:11, color:'var(--sand-dim)', marginTop:8}}>No image? A placeholder will be used automatically.</p>
        </div>
        <div className="field" style={{display:'flex', alignItems:'center', gap:10}}>
          <input type="checkbox" id="featured" style={{width:'auto'}} checked={form.featured} onChange={e=>setForm(f=>({...f, featured:e.target.checked}))} />
          <label htmlFor="featured" style={{margin:0}}>Mark as Featured (shows on homepage)</label>
        </div>
        <div style={{display:'flex', gap:12, marginTop:10}}>
          <button className="btn btn-primary" type="submit">{initial ? 'Save Changes' : 'Add Product'}</button>
          <button className="btn btn-outline" type="button" onClick={onCancel}>Cancel</button>
        </div>
      </form>
    </div>
  );
}

/* ---------------- Admin: Dashboard ---------------- */
function AdminDashboard({ products, setProducts, fireToast, onLogout }){
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);

  const [saving, setSaving] = useState(false);

  const handleSave = async (product) => {
    setSaving(true);
    try{
      if(editing){
        const saved = await updateProductRow(editing.id, product);
        if(saved){
          setProducts(products.map(p=>p.id===editing.id ? saved : p));
          fireToast('Product updated');
        }
      } else {
        const saved = await insertProduct(product);
        if(saved){
          setProducts([saved, ...products]);
          fireToast('Product added');
        }
      }
      setShowForm(false);
      setEditing(null);
    }catch(e){
      fireToast('Error saving product — check console');
    }
    setSaving(false);
  };

  const handleDelete = async (id) => {
    if(!window.confirm('Delete this product? This cannot be undone.')) return;
    try{
      await deleteProductRow(id);
      setProducts(products.filter(p=>p.id!==id));
      fireToast('Product deleted');
    }catch(e){
      fireToast('Error deleting product — check console');
    }
  };

  const totalValue = products.reduce((s,p)=>s+p.price,0);

  return (
    <div className="admin-shell">
      <div className="admin-nav">
        <div className="brand"><span className="brand-name serif">Noor &amp; Weave</span><span className="brand-sub">Admin Dashboard</span></div>
        <div style={{display:'flex', gap:20, alignItems:'center'}}>
          <a href="#" onClick={(e)=>{e.preventDefault(); window.location.hash='';}} style={{fontSize:13, color:'var(--sand-dim)'}}>View Store →</a>
          <button className="btn btn-outline" onClick={onLogout}>Log Out</button>
        </div>
      </div>
      <div className="admin-body">
        <div className="stat-row">
          <div className="stat-box"><div className="num serif">{products.length}</div><div className="lbl">Total Products</div></div>
          <div className="stat-box"><div className="num serif">{products.filter(p=>p.featured).length}</div><div className="lbl">Featured Items</div></div>
          <div className="stat-box"><div className="num serif">Rs. {totalValue.toLocaleString()}</div><div className="lbl">Catalog Value</div></div>
        </div>

        {showForm ? (
          <ProductForm
            initial={editing}
            onSave={handleSave}
            onCancel={()=>{ setShowForm(false); setEditing(null); }}
          />
        ) : (
          <button className="btn btn-primary" onClick={()=>setShowForm(true)} style={{marginBottom:30}}>+ Add New Product</button>
        )}

        <div className="admin-panel-box">
          <h3 className="serif">All Products</h3>
          {products.length===0 ? (
            <div className="empty-state"><h3>No products yet</h3><p>Click "Add New Product" to get started.</p></div>
          ) : (
            <table className="admin-table">
              <thead>
                <tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Featured</th><th>Actions</th></tr>
              </thead>
              <tbody>
                {products.map(p=>(
                  <tr key={p.id}>
                    <td><img src={p.images[0]} alt={p.name} /></td>
                    <td>{p.name}</td>
                    <td>{p.category}</td>
                    <td>Rs. {p.price.toLocaleString()}</td>
                    <td>{p.featured ? 'Yes' : '—'}</td>
                    <td>
                      <div className="admin-actions-cell">
                        <button className="link-btn" onClick={()=>{ setEditing(p); setShowForm(true); window.scrollTo({top:0, behavior:'smooth'}); }}>Edit</button>
                        <button className="link-btn danger" onClick={()=>handleDelete(p.id)}>Delete</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

function Admin({ products, setProducts, fireToast }){
  const [authed, setAuthed] = useState(false);
  const [checking, setChecking] = useState(true);

  useEffect(()=>{
    (async ()=>{
      if(!supabaseClient){ setChecking(false); return; }
      try{
        const { data } = await supabaseClient.auth.getSession();
        setAuthed(!!(data && data.session));
      }catch(e){}
      setChecking(false);
    })();
  }, []);

  const handleLogout = async () => {
    if(supabaseClient){
      try{ await supabaseClient.auth.signOut(); }catch(e){}
    }
    setAuthed(false);
  };

  if(checking){
    return (
      <div className="admin-login">
        <div className="spinner"></div>
      </div>
    );
  }

  if(!authed) return <AdminLogin onSuccess={()=>setAuthed(true)} />;
  return <AdminDashboard products={products} setProducts={setProducts} fireToast={fireToast} onLogout={handleLogout} />;
}

  const [cartOpen, setCartOpen] = useState(false);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [fireToast, toastNode] = useToast();

  useEffect(()=>{
    (async ()=>{
      const [result, c] = await Promise.all([loadProducts(), loadCart()]);
      setProducts(result.data);
      if(result.error) setLoadError(result.error);
      setCart(c);
      setLoading(false);
    })();
  }, []);

  const go = (r, p={}) => {
    setRoute(r); setParams(p);
    window.scrollTo({top:0, behavior:'instant'});
  };

  const addToCart = async (product, qty=1) => {
    setCart(prev=>{
      const existing = prev.find(x=>x.id===product.id);
      let updated;
      if(existing){
        updated = prev.map(x=>x.id===product.id ? {...x, qty:x.qty+qty} : x);
      } else {
        updated = [...prev, { id:product.id, qty }];
      }
      saveCart(updated);
      return updated;
    });
    fireToast(`Added "${product.name}" to bag`);
    setCartOpen(true);
  };

  const quickAdd = (product) => addToCart(product, 1);

  const updateQty = async (id, qty) => {
    setCart(prev=>{
      const updated = prev.map(x=>x.id===id ? {...x, qty} : x);
      saveCart(updated);
      return updated;
    });
  };

  const removeItem = async (id) => {
    setCart(prev=>{
      const updated = prev.filter(x=>x.id!==id);
      saveCart(updated);
      return updated;
    });
    fireToast('Removed from bag');
  };

  const clearCart = async () => {
    setCart([]);
    saveCart([]);
  };

  const cartCount = cart.reduce((s,x)=>s+x.qty, 0);

  if(loading){
    return (
      <div className="loading-screen">
        <div className="spinner"></div>
        <span className="eyebrow">Loading Noor &amp; Weave</span>
      </div>
    );
  }

  if(route==='admin'){
    return (
      <div className="app">
        {loadError && (
          <div style={{background:'#5c1c1c', color:'#f3ede3', padding:'14px 20px', fontSize:13, textAlign:'center'}}>
            Couldn't load products: {loadError}. Check your internet connection or refresh the page.
          </div>
        )}
        <Admin products={products} setProducts={setProducts} fireToast={fireToast} />
        {toastNode}
      </div>
    );
  }

  if(route==='checkout'){
    return (
      <div className="app">
        <AnnounceBar />
        <Nav route={route} go={go} cartCount={cartCount} openCart={()=>setCartOpen(true)} />
        <Checkout cart={cart} products={products} go={go} clearCart={clearCart} />
        <Footer go={go} />
        {toastNode}
      </div>
    );
  }

  return (
    <div className="app">
      {loadError && (
        <div style={{background:'#5c1c1c', color:'#f3ede3', padding:'14px 20px', fontSize:13, textAlign:'center'}}>
          Couldn't load products: {loadError}. Check your internet connection or refresh the page.
        </div>
      )}
      <AnnounceBar />
      <Nav route={route} go={go} cartCount={cartCount} openCart={()=>setCartOpen(true)} />
      {route==='home' && <Home products={products} go={go} onQuickAdd={quickAdd} />}
      {route==='shop' && <Shop products={products} params={params} go={go} onQuickAdd={quickAdd} />}
      {route==='product' && <ProductDetail products={products} params={params} go={go} onAddToCart={addToCart} />}
      {route==='info' && <InfoPage pageKey={params.page} go={go} />}
      <Footer go={go} />
      <CartDrawer
        open={cartOpen}
        close={()=>setCartOpen(false)}
        cart={cart}
        updateQty={updateQty}
        removeItem={removeItem}
        products={products}
        go={go}
      />
      {toastNode}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
